<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>EZOS 3.0 — Web Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='%2338bdf8'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/><text x='32' y='44' font-family='Arial' font-size='36' font-weight='bold' text-anchor='middle' fill='%2307111c'>E</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --bg2:#0b1220; --panel:rgba(17,24,39,.78); --panel-solid:#101828;
  --text:#e8eefb; --muted:#8ea0bd; --border:rgba(255,255,255,.10);
  --tint1:rgba(255,255,255,.045); --tint2:rgba(255,255,255,.075); --tint3:rgba(255,255,255,.11);
  --accent:#38bdf8; --accent-soft:rgba(56,189,248,.16); --danger:#f87171;
  --taskbar-h:52px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 24px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
::selection{background:var(--accent-soft)}
*{scrollbar-width:thin;scrollbar-color:rgba(128,140,160,.35) transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,140,160,.35);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- desktop ---------- */
#desktop{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;background:#0a0f1c;transition:background .45s ease}
#wallpaper::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35));pointer-events:none}
#desktop-icons{position:absolute;top:16px;left:16px;right:16px;bottom:calc(var(--taskbar-h) + 18px);display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,100px);grid-auto-columns:96px;gap:4px;align-content:start;justify-content:start}
.dicon{width:92px;height:96px;padding:8px 4px;border-radius:12px;text-align:center;cursor:default;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px;touch-action:manipulation}
.dicon:hover{background:var(--tint1)}
.dicon.sel{background:var(--accent-soft);border-color:var(--accent-soft)}
.dicon .ico{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;font-size:25px;border:1px solid var(--tint3);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.32);flex:none}
.dicon .lbl{font-size:11.5px;line-height:1.25;color:#eef4fd;text-shadow:0 1px 3px rgba(0,0,0,.85);max-width:88px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- taskbar ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-top:1px solid var(--border);z-index:900}
#startBtn{height:36px;padding:0 13px 0 9px;display:flex;align-items:center;gap:8px;border-radius:10px;background:var(--tint1);border:1px solid var(--border);color:var(--text);font-weight:800;letter-spacing:.14em;font-size:11px}
#startBtn:hover{background:var(--tint2)}
#startBtn.on{background:var(--accent-soft);border-color:var(--accent-soft)}
.logo-mini{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#38bdf8,#a78bfa);display:grid;place-items:center;color:#06121d;font-size:13px;font-weight:900;letter-spacing:0}
#tasklist{flex:1;display:flex;gap:6px;overflow:hidden;min-width:0}
.titem{display:flex;align-items:center;gap:7px;height:36px;padding:0 10px;border-radius:9px;background:transparent;border:1px solid transparent;color:var(--text);max-width:180px;min-width:0}
.titem:hover{background:var(--tint1)}
.titem.active{background:var(--tint2);border-color:var(--border)}
.titem .ico{font-size:14px;flex:none}
.titem .lbl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tray{display:flex;align-items:center;gap:6px;flex:none}
.tray-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:14px}
.tray-btn:hover{background:var(--tint2);color:var(--text)}
#clock{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text);padding:0 6px;letter-spacing:.02em}

/* ---------- windows ---------- */
#windows{position:absolute;inset:0 0 var(--taskbar-h) 0;pointer-events:none;z-index:100}
.window{position:absolute;display:flex;flex-direction:column;min-width:320px;min-height:200px;background:var(--panel);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden;pointer-events:auto;outline:none;animation:winIn .16s ease}
@keyframes winIn{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}
.window.active{box-shadow:var(--shadow);border-color:rgba(255,255,255,.16)}
.window.maxed{border-radius:0}
body.dragging,body.dragging *{user-select:none!important;cursor:grabbing!important}
.win-titlebar{height:42px;flex:none;display:flex;align-items:center;gap:9px;padding:0 8px 0 13px;cursor:grab;background:linear-gradient(180deg,var(--tint1),transparent);border-bottom:1px solid var(--border);touch-action:none}
.win-titlebar:active{cursor:grabbing}
.win-ico{font-size:14px;flex:none}
.win-title{flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-controls{display:flex;gap:4px;flex:none}
.wbtn{width:27px;height:27px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:13px;line-height:1;display:grid;place-items:center}
.wbtn:hover{background:var(--tint2);color:var(--text)}
.wbtn.close:hover{background:#e5484d;color:#fff}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:6;background:linear-gradient(135deg,transparent 48%,var(--tint3) 48%);border-radius:0 0 14px 0;touch-action:none}
.window.maxed .rz{display:none}

/* ---------- start menu ---------- */
#startMenu{position:fixed;left:10px;bottom:calc(var(--taskbar-h) + 8px);width:380px;max-width:calc(100vw - 20px);background:var(--panel);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:12px;z-index:950;display:none;flex-direction:column;gap:10px}
#startMenu.open{display:flex;animation:menuIn .15s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sm-search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--tint1);color:var(--text);padding:0 12px;font-size:13px;outline:none}
.sm-search input:focus{border-color:var(--accent)}
.sm-search input::placeholder{color:var(--muted)}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-height:300px;overflow:auto;padding:2px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:12px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text)}
.sm-app:hover{background:var(--tint2);border-color:var(--border)}
.sm-app .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;border:1px solid var(--tint3)}
.sm-app small{font-size:11px}
.sm-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:grid;place-items:center;font-weight:800;color:#07111c;font-size:14px;flex:none}

/* ---------- generic controls ---------- */
.icon-btn{height:30px;min-width:30px;padding:0 9px;border-radius:8px;border:1px solid var(--border);background:var(--tint1);color:var(--text);font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.icon-btn:hover{background:var(--tint2)}
.icon-btn:active{transform:translateY(1px)}
.btn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--tint2);color:var(--text);font-size:12.5px}
.btn:hover{background:var(--tint3)}
.btn.primary{background:var(--accent);color:#07111c;border-color:transparent;font-weight:700}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent;font-weight:600}

/* ---------- terminal ---------- */
.term{position:absolute;inset:0;display:flex;flex-direction:column;background:#070b12;font-family:var(--mono);font-size:12.5px;color:#d8e3f2}
.term-out{flex:1;overflow-y:auto;padding:12px 14px 4px;white-space:pre-wrap;word-break:break-word;line-height:1.55;user-select:text}
.term-line{flex:none;display:flex;gap:8px;align-items:center;padding:0 14px 12px;font-family:var(--mono);font-size:12.5px}
.term-prompt{color:var(--accent);white-space:nowrap;font-weight:600}
.term-in{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#eef4fd;font:inherit;padding:0;caret-color:var(--accent)}
.term .p{color:var(--accent);font-weight:600}
.term .d{color:#7dd3fc}
.term .err{color:#fb7185}
.term .ok{color:#34d399}
.term .dim{color:#5d7594}

/* ---------- files ---------- */
.files{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel-solid);color:var(--text)}
.files-top{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex:none}
.crumbs{flex:1;display:flex;gap:1px;align-items:center;font-size:12px;color:var(--muted);overflow:hidden;min-width:110px;white-space:nowrap}
.crumb{padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:var(--tint2);color:var(--text)}
.crumb-sep{opacity:.4;padding:0 1px}
.files-main{flex:1;display:flex;min-height:0}
.sidebar{width:168px;flex:none;border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side-item{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;border:none;background:transparent;color:var(--text);text-align:left}
.side-item:hover{background:var(--tint2)}
.side-item.active{background:var(--accent-soft);color:var(--accent)}
.files-grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:4px;align-content:start}
.fitem{padding:10px 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:default;border:1px solid transparent;touch-action:manipulation}
.fitem:hover{background:var(--tint1)}
.fitem.sel{background:var(--accent-soft);border-color:var(--accent-soft)}
.fitem .fi{font-size:29px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.fitem .fn{font-size:11.5px;text-align:center;word-break:break-word;max-height:30px;overflow:hidden;line-height:1.25}
.files-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12.5px;padding:40px 0}

/* ---------- editor ---------- */
.editor{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel-solid)}
.ed-top{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);align-items:center;flex:none}
.ed-path{flex:1;min-width:0;background:var(--tint1);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;padding:7px 10px;font-family:var(--mono);outline:none}
.ed-path:focus{border-color:var(--accent)}
.ed-area{flex:1;resize:none;border:none;outline:none;background:transparent;color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.65;padding:14px;white-space:pre;tab-size:2;user-select:text}
.ed-status{flex:none;padding:5px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:14px;font-family:var(--mono)}
.ed-dirty{color:var(--accent)}

/* ---------- calculator ---------- */
.calc{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel-solid);padding:12px;gap:10px}
.calc-disp{height:62px;flex:none;border-radius:10px;background:var(--tint1);border:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-family:var(--mono);font-size:23px;overflow:hidden;white-space:nowrap;direction:ltr}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.calc-grid button{border-radius:10px;border:1px solid var(--border);background:var(--tint1);color:var(--text);font-size:16px;min-height:0}
.calc-grid button:hover{background:var(--tint3)}
.calc-grid button.op{color:var(--accent);font-weight:600}
.calc-grid button.warn{color:var(--danger)}
.calc-grid button.eq{background:var(--accent);color:#07111c;border-color:transparent;font-weight:800}
.calc-grid button.wide{grid-column:span 2}

/* ---------- settings ---------- */
.settings{position:absolute;inset:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;background:var(--panel-solid);color:var(--text)}
 .set-sec h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:700}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.set-row:last-child{border-bottom:none}
.theme-row{display:flex;gap:8px;flex-wrap:wrap}
.theme-card{width:92px;height:60px;border-radius:10px;cursor:pointer;position:relative;border:2px solid var(--border);overflow:hidden}
.theme-card.active{border-color:var(--accent)}
.theme-card span{position:absolute;left:7px;bottom:5px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.theme-card i{position:absolute;right:7px;top:7px;width:10px;height:10px;border-radius:50%}
.swatches{display:flex;gap:9px;flex-wrap:wrap;padding:3px 0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.sw.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.wps{display:flex;gap:8px;flex-wrap:wrap}
.wp{width:92px;height:54px;border-radius:10px;cursor:pointer;border:2px solid var(--border)}
.wp.active{border-color:var(--accent)}

/* ---------- package store ---------- */
.store{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel-solid);color:var(--text)}
.store-top{flex:none;display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.store-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.store-title .badge{font-size:9.5px;font-weight:600;font-family:var(--mono);color:var(--muted);padding:3px 7px;border-radius:99px;background:var(--tint1);border:1px solid var(--border)}
.store-search{flex:1;min-width:130px;height:30px;background:var(--tint1);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;padding:0 10px;outline:none}
.store-search:focus{border-color:var(--accent)}
.store-list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.store-empty{padding:28px 12px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.pkg{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--tint1)}
.pkg-ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:19px;background:linear-gradient(145deg,rgba(56,189,248,.22),rgba(167,139,250,.22));border:1px solid var(--border)}
.pkg-meta{flex:1;min-width:0}
.pkg-name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pkg-name .tag{font-size:9px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 6px;letter-spacing:.04em}
.pkg-desc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.pkg-sub{font-size:10px;color:var(--muted);margin-top:3px;font-family:var(--mono);opacity:.8}
.pkg-act{flex:none;display:flex;gap:6px;align-items:center}
.pkg-act .btn{height:29px;padding:0 11px;font-size:11.5px}
.pkg-act .btn[disabled]{opacity:.55;pointer-events:none}
.pkg-act .btn.installed{background:transparent;border-color:var(--border);color:var(--muted)}
.store-foot{flex:none;display:flex;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted)}
.store-foot a{color:var(--accent);text-decoration:none}
.store-note{flex:none;font-size:10.5px;color:var(--muted);padding:6px 12px 10px;line-height:1.55}

/* ---------- system monitor ---------- */
.mon{position:absolute;inset:0;overflow:auto;padding:14px;background:var(--panel-solid);color:var(--text);display:flex;flex-direction:column;gap:10px}
.mon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mon-card{border:1px solid var(--border);border-radius:12px;padding:11px 12px;background:var(--tint1)}
.mon-card h5{margin:0 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.mon-big{font-family:var(--mono);font-size:17px;font-weight:700}
.mon-sub{font-size:10.5px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.mon-bar{height:6px;border-radius:99px;background:var(--tint3);overflow:hidden;margin-top:8px}
.mon-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.mon-proc{width:100%;border-collapse:collapse;font-size:11.5px;font-family:var(--mono)}
.mon-proc th{text-align:left;font-weight:600;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;padding:4px 6px;border-bottom:1px solid var(--border)}
.mon-proc td{padding:5px 6px;border-bottom:1px solid var(--border)}
.mon-proc tr:last-child td{border-bottom:none}
.mon-proc .st-run{color:#34d399}
.mon-proc .st-min{color:var(--muted)}

/* ---------- about ---------- */
.about{position:absolute;inset:0;overflow:auto;padding:22px;color:var(--text);background:var(--panel-solid);display:flex;flex-direction:column;gap:12px}
.about .biglogo{width:62px;height:62px;border-radius:17px;background:linear-gradient(135deg,#38bdf8,#a78bfa);display:grid;place-items:center;font-weight:900;font-size:30px;color:#06121d;box-shadow:0 12px 34px rgba(56,189,248,.3)}
.about h2{font-size:19px;font-weight:800;letter-spacing:.02em}
.about .sub{font-size:12px;color:var(--muted);margin-top:-8px}
.about p{font-size:12.5px;line-height:1.65;color:var(--muted);max-width:430px}
.about .chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:5px 9px;border-radius:99px;background:var(--tint2);border:1px solid var(--border);color:var(--text)}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--tint2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text)}

/* ---------- preview ---------- */
.preview{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel-solid)}
.preview .pv-wrap{flex:1;display:grid;place-items:center;padding:14px;min-height:0;background:repeating-conic-gradient(var(--tint1) 0% 25%,transparent 0% 50%) 50%/18px 18px}
.preview img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.preview .pv-top{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}
.preview .pv-top span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- snake ---------- */
.snake{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--panel-solid);align-items:center}
.snake-head{display:flex;width:100%;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.snake-head b{color:var(--text);font-family:var(--mono)}
.snake-canvas{width:100%;max-width:420px;aspect-ratio:1;border-radius:10px;touch-action:none;display:block}
.snake-hint{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.6}

/* ---------- paint ---------- */
.paint{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--panel-solid)}
.paint-top{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex:none}
.paint-top input[type=color]{width:30px;height:30px;border:none;background:transparent;padding:0;cursor:pointer;border-radius:8px}
.paint-top input[type=range]{width:90px;accent-color:var(--accent)}
.paint-top .lbl{font-size:11.5px;color:var(--muted)}
.paint-wrap{flex:1;position:relative;background:#fff;min-height:0}
.paint-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* ---------- boot / login ---------- */
#boot{position:fixed;inset:0;background:#04070d;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:var(--mono);transition:opacity .4s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .logo-big{width:82px;height:82px;border-radius:23px;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#04121f;display:grid;place-items:center;font-size:43px;font-weight:900;font-family:var(--font);box-shadow:0 20px 60px rgba(56,189,248,.35)}
#boot .name{font-family:var(--font);font-weight:800;letter-spacing:.55em;font-size:19px;color:#eaf4ff;text-indent:.55em}
#boot .ver{font-size:10px;color:#5c7695;letter-spacing:.24em;text-indent:.24em;margin-top:-10px}
#bootLog{width:min(560px,86vw);height:132px;overflow:hidden;font-size:11px;color:#7f9cbd;line-height:1.75}
#bootLog .ok{color:#34d399}
#bootBar{width:min(320px,70vw);height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
#bootBar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#a78bfa);border-radius:99px;transition:width .22s ease}
.boot-skip{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:10.5px;color:#3f5670;font-family:var(--font)}
#login{position:fixed;inset:0;z-index:4000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#eef4fd;background:#0a0f1c;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s;user-select:none}
#login.show{opacity:1;visibility:visible}
#login .ltime{font-size:clamp(44px,9vw,68px);font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.4)}
#login .ldate{color:rgba(234,242,252,.65);font-size:13.5px;margin:10px 0 46px}
#login .luser{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;padding:16px 30px;border-radius:18px;transition:background .2s;border:none;background:transparent;color:#eef4fd}
#login .luser:hover{background:rgba(255,255,255,.06)}
#login .lav{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:grid;place-items:center;font-size:29px;font-weight:800;color:#06121d;box-shadow:0 14px 44px rgba(0,0,0,.45)}
#login .lname{font-size:15px;font-weight:600}
#login .lhint{font-size:11px;color:rgba(234,242,252,.55)}
#login .lfoot{position:absolute;bottom:26px;font-size:10.5px;letter-spacing:.18em;color:rgba(234,242,252,.35)}

/* ---------- toast / dialog / ctx ---------- */
#toasts{position:fixed;right:14px;bottom:calc(var(--taskbar-h) + 14px);display:flex;flex-direction:column;gap:8px;z-index:1200;pointer-events:none;align-items:flex-end}
.toast{background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--text);box-shadow:0 12px 34px rgba(0,0,0,.4);display:flex;gap:9px;align-items:center;animation:toastIn .2s ease;max-width:320px}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:all .25s}
.dialog-overlay{position:fixed;inset:0;background:rgba(2,6,14,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:3000;display:grid;place-items:center;padding:16px}
.dialog{width:min(380px,100%);background:var(--panel-solid);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);color:var(--text);animation:winIn .16s ease}
.dialog h3{margin:0 0 6px;font-size:15px;font-weight:700}
.dialog p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.55}
.dialog input{width:100%;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--tint1);color:var(--text);padding:0 11px;font-size:13px;outline:none;font-family:var(--mono)}
.dialog input:focus{border-color:var(--accent)}
.dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#ctxMenu{position:fixed;z-index:2000;min-width:186px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:10px;padding:5px;display:none;box-shadow:0 16px 44px rgba(0,0,0,.5)}
#ctxMenu button{display:flex;width:100%;gap:9px;align-items:center;padding:8px 10px;border:none;background:transparent;color:var(--text);font-size:12.5px;border-radius:7px;text-align:left}
#ctxMenu button:hover{background:var(--tint2)}

@media (max-width:640px){
  :root{--taskbar-h:48px}
  .titem .lbl{display:none}
  .titem{max-width:44px;padding:0 10px}
  #startBtn{padding:0 10px 0 8px}
  #startBtn .start-txt{display:none}
  .dicon{width:80px}
  .dicon .ico{width:46px;height:46px;font-size:23px}
  .sm-grid{grid-template-columns:repeat(4,1fr)}
  .sidebar{width:132px}
  .win-titlebar{height:38px}
  #clock{font-size:11.5px}
  .about{padding:16px}
  #login .ltime{font-size:56px}
}
</style>
</head>
<body>

<div id="desktop">
  <div id="wallpaper"></div>
  <div id="desktop-icons"></div>
  <div id="windows"></div>

  <div id="taskbar">
    <button id="startBtn" title="Start menu"><span class="logo-mini">E</span><span class="start-txt">EZOS</span></button>
    <div id="tasklist"></div>
    <div id="tray">
      <button class="tray-btn" id="soundBtn" title="Sound">🔊</button>
      <span id="clock">--:--</span>
    </div>
  </div>

  <div id="startMenu"></div>
  <div id="ctxMenu"></div>
  <div id="toasts"></div>
</div>

<div id="login">
  <div class="ltime" id="loginTime">--:--</div>
  <div class="ldate" id="loginDate"></div>
  <button class="luser" id="loginUser">
    <div class="lav">U</div>
    <div class="lname">user</div>
    <div class="lhint">Click to log in</div>
  </button>
  <div class="lfoot">EZOS 3.0 · WEB EDITION</div>
</div>

<div id="boot">
  <div class="logo-big">E</div>
  <div class="name">EZOS</div>
  <div class="ver">WEB EDITION · v3.0</div>
  <div id="bootLog"></div>
  <div id="bootBar"><i></i></div>
  <div class="boot-skip">Click anywhere to skip</div>
</div>

<script>
/* =======================================================================
   EZOS 3.0 — Web Edition
   A tiny operating system experience in a single HTML file.
   ======================================================================= */
'use strict';

/* ---------------- utils ---------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function el(tag, cls, html){ const n = document.createElement(tag); if(cls) n.className = cls; if(html != null) n.innerHTML = html; return n; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function pad(s, n){ s = String(s); return s + ' '.repeat(Math.max(0, n - s.length)); }
function isEditable(e){ return e && /INPUT|TEXTAREA|SELECT/.test(e.tagName); }
function dataURL(node){ return node && node.type === 'file' && typeof node.content === 'string' && node.content.startsWith('data:image'); }

function tokenize(s){
  const out = []; let cur = ''; let q = null;
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(q){ if(c === q) q = null; else cur += c; }
    else if(c === '"' || c === "'") q = c;
    else if(/\s/.test(c)){ if(cur){ out.push(cur); cur = ''; } }
    else cur += c;
  }
  if(cur) out.push(cur);
  return out;
}

/* ---------------- themes / wallpapers / accents ---------------- */
const THEMES = {
  midnight: { bg:'#070b14', bg2:'#0b1220', panel:'rgba(17,24,39,.78)', panelSolid:'#101828', text:'#e8eefb', muted:'#8ea0bd', border:'rgba(255,255,255,.10)', tint1:'rgba(255,255,255,.045)', tint2:'rgba(255,255,255,.075)', tint3:'rgba(255,255,255,.11)' },
  nord:     { bg:'#0f1520', bg2:'#151d2c', panel:'rgba(29,39,56,.80)', panelSolid:'#1a2334', text:'#e5ecf6', muted:'#93a4bd', border:'rgba(255,255,255,.09)', tint1:'rgba(255,255,255,.04)', tint2:'rgba(255,255,255,.07)', tint3:'rgba(255,255,255,.10)' },
  light:    { bg:'#eef2f8', bg2:'#e6ebf3', panel:'rgba(255,255,255,.84)', panelSolid:'#ffffff', text:'#12203a', muted:'#5b6b85', border:'rgba(10,25,50,.12)', tint1:'rgba(10,25,50,.04)', tint2:'rgba(10,25,50,.07)', tint3:'rgba(10,25,50,.10)' },
  amoled:   { bg:'#000000', bg2:'#050506', panel:'rgba(12,12,14,.86)', panelSolid:'#0a0a0c', text:'#e8ecf3', muted:'#7e8aa0', border:'rgba(255,255,255,.09)', tint1:'rgba(255,255,255,.04)', tint2:'rgba(255,255,255,.07)', tint3:'rgba(255,255,255,.10)' }
};
const WALLPAPERS = {
  aurora: 'radial-gradient(1100px 760px at 12% 8%, rgba(56,189,248,.30), transparent 62%), radial-gradient(1000px 700px at 88% 16%, rgba(167,139,250,.26), transparent 58%), radial-gradient(900px 620px at 55% 96%, rgba(45,212,191,.20), transparent 60%), linear-gradient(160deg,#070b14,#0b1020 48%,#090e1a)',
  sunset: 'radial-gradient(1000px 700px at 82% 12%, rgba(251,146,60,.32), transparent 60%), radial-gradient(900px 640px at 16% 86%, rgba(236,72,153,.26), transparent 58%), radial-gradient(800px 560px at 50% 50%, rgba(168,85,247,.18), transparent 62%), linear-gradient(170deg,#120a14,#1a0f1c 50%,#0d0812)',
  ocean:  'radial-gradient(1100px 720px at 20% 20%, rgba(14,165,233,.30), transparent 60%), radial-gradient(900px 680px at 84% 78%, rgba(6,182,212,.22), transparent 58%), radial-gradient(760px 520px at 60% 8%, rgba(59,130,246,.16), transparent 60%), linear-gradient(165deg,#04101c,#071a2b 50%,#030c16)',
  forest: 'radial-gradient(1000px 700px at 16% 84%, rgba(34,197,94,.24), transparent 60%), radial-gradient(900px 660px at 82% 14%, rgba(132,204,22,.16), transparent 58%), radial-gradient(800px 560px at 50% 50%, rgba(16,185,129,.12), transparent 62%), linear-gradient(160deg,#06110d,#0a1a13 52%,#050d0a)',
  mono:   'radial-gradient(1000px 700px at 24% 16%, rgba(148,163,184,.18), transparent 60%), radial-gradient(900px 640px at 78% 82%, rgba(100,116,139,.14), transparent 60%), linear-gradient(160deg,#0b0e13,#12161d 55%,#080a0e)'
};
const ACCENTS = ['#38bdf8', '#a78bfa', '#34d399', '#f472b6', '#fbbf24', '#f87171'];

const DEFAULT_SETTINGS = { theme:'midnight', accent:'#38bdf8', wallpaper:'aurora', sound:true };
let settings = { ...DEFAULT_SETTINGS };
let SESSION_START = Date.now();

function loadSettings(){
  try {
    const raw = localStorage.getItem('ezos.settings.v1');
    if(raw) settings = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
  } catch(e){}
}
function saveSettings(){
  try { localStorage.setItem('ezos.settings.v1', JSON.stringify(settings)); } catch(e){}
}
function applyTheme(name){
  if(!THEMES[name]) name = 'midnight';
  settings.theme = name; saveSettings();
  const t = THEMES[name];
  const root = document.documentElement.style;
  root.setProperty('--bg', t.bg);
  root.setProperty('--bg2', t.bg2);
  root.setProperty('--panel', t.panel);
  root.setProperty('--panel-solid', t.panelSolid);
  root.setProperty('--text', t.text);
  root.setProperty('--muted', t.muted);
  root.setProperty('--border', t.border);
  root.setProperty('--tint1', t.tint1);
  root.setProperty('--tint2', t.tint2);
  root.setProperty('--tint3', t.tint3);
  document.body.style.background = t.bg;
}
function applyAccent(hex){
  settings.accent = hex; saveSettings();
  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-soft', hexA(hex, .16));
}
function applyWallpaper(name){
  if(!WALLPAPERS[name]) name = 'aurora';
  settings.wallpaper = name; saveSettings();
  const bg = WALLPAPERS[name];
  const wp = $('#wallpaper'), login = $('#login');
  if(wp) wp.style.background = bg;
  if(login) login.style.background = bg;
}

/* ---------------- virtual file system ---------------- */
const FS = {
  KEY: 'ezos.fs.v1',
  root: null,
  load(){
    let data = null;
    try { data = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch(e){ data = null; }
    if(!data || data.type !== 'dir') data = this.defaults();
    this.root = data;
    this.save();
  },
  save(){
    try { localStorage.setItem(this.KEY, JSON.stringify(this.root)); } catch(e){}
  },
  defaults(){
    const dir = (children={}) => ({ type:'dir', children, created: Date.now(), modified: Date.now() });
    const file = (content='') => ({ type:'file', content, created: Date.now(), modified: Date.now() });
    return dir({
      home: dir({ user: dir({
        'welcome.txt': file(
          'Welcome to EZOS 3.0 — Web Edition\n\n' +
          'This little operating system runs entirely inside a single HTML file.\n' +
          'No installs, no servers — just your browser.\n\n' +
          'Things to try:\n' +
          '  • Open Terminal and type: help  /  neofetch\n' +
          '  • Create a file in Editor and save it to /home/user/Documents\n' +
          '  • Play Snake or draw something in Paint\n' +
          '  • Open Store or run: ezpkg install fastfetch\n' +
          '  • Right-click the desktop for options\n' +
          '  • Change themes in Settings\n\n' +
          'Everything you create is stored in your browser (localStorage),\n' +
          'so it survives a page reload.\n\n' +
          'Have fun!\n— The EZOS team\n'
        ),
        'notes.txt': file(
          '# Scratchpad\n\n' +
          '- [ ] Try the terminal: help, tree, neofetch\n' +
          '- [ ] Make a drawing in Paint and save it to Pictures\n' +
          '- [ ] Beat the high score in Snake\n' +
          '- [ ] Reboot with the command: reboot\n'
        ),
        Documents: dir({}),
        Pictures: dir({}),
        Music: dir({})
      })}),
      etc: dir({
        'ezos-release': file('NAME="EZOS"\nVERSION="3.0 (Web Edition)"\nID=ezos\nPRETTY_NAME="EZOS 3.0 Web Edition"\nCODENAME=horizon\nHOME_URL="about"\n'),
        'hostname': file('ezos\n')
      }),
      bin: dir({}),
      usr: dir({ share: dir({}) }),
      tmp: dir({}),
      var: dir({ log: dir({}) })
    });
  },
  norm(path, cwd='/home/user'){
    path = String(path == null ? '' : path).trim();
    if(!path) path = '.';
    if(path === '~') path = '/home/user';
    else if(path.startsWith('~/')) path = '/home/user/' + path.slice(2);
    const base = path.startsWith('/') ? '' : cwd;
    const parts = (base + '/' + path).split('/');
    const out = [];
    for(const p of parts){
      if(!p || p === '.') continue;
      if(p === '..'){ out.pop(); continue; }
      out.push(p);
    }
    return '/' + out.join('/');
  },
  node(path){
    const parts = String(path).split('/').filter(Boolean);
    let cur = this.root;
    for(const p of parts){
      if(!cur || cur.type !== 'dir') return null;
      cur = cur.children[p];
      if(cur === undefined) return null;
    }
    return cur || null;
  },
  parent(path){
    if(!path || path === '/') return null;
    const idx = path.lastIndexOf('/');
    const parentPath = idx <= 0 ? '/' : path.slice(0, idx);
    return { name: path.slice(idx + 1), path: parentPath, node: this.node(parentPath) };
  },
  mkdir(path){
    const p = this.parent(path);
    if(!p || !p.node || p.node.type !== 'dir') return { ok:false, err:'Parent folder not found' };
    if(p.node.children[p.name]) return { ok:false, err:'Already exists' };
    p.node.children[p.name] = { type:'dir', children:{}, created:Date.now(), modified:Date.now() };
    this.save(); return { ok:true };
  },
  write(path, content, mime){
    const p = this.parent(path);
    if(!p || !p.node || p.node.type !== 'dir') return { ok:false, err:'Folder not found' };
    const existing = p.node.children[p.name];
    if(existing && existing.type === 'dir') return { ok:false, err:'Is a folder' };
    p.node.children[p.name] = {
      type:'file', content,
      mime: mime ?? existing?.mime,
      created: existing?.created ?? Date.now(),
      modified: Date.now()
    };
    this.save(); return { ok:true };
  },
  read(path){
    const n = this.node(path);
    return n && n.type === 'file' ? n.content : null;
  },
  rm(path){
    if(path === '/') return { ok:false, err:'Cannot remove root' };
    const p = this.parent(path);
    if(!p || !p.node || p.node.type !== 'dir' || !p.node.children[p.name]) return { ok:false, err:'No such file or directory' };
    delete p.node.children[p.name];
    this.save(); return { ok:true };
  },
  list(path){
    const n = this.node(path);
    if(!n || n.type !== 'dir') return null;
    return Object.entries(n.children).sort((a, b) => {
      const ad = a[1].type === 'dir', bd = b[1].type === 'dir';
      if(ad !== bd) return ad ? -1 : 1;
      return a[0].localeCompare(b[0]);
    });
  }
};

/* ---------------- package manager (ezpkg) + ezos-repo ---------------- */
const PKG_REPO_URL = 'https://github.com/mrzgamingv20-cyber/ezos-repo';
const PKG_BASE = 'https://raw.githubusercontent.com/mrzgamingv20-cyber/ezos-repo/main/packages';

/* Mirrors packages/index.json from ezos-repo so the store also works offline. */
const PKG_FALLBACK = {
  curl: 'Command-line tool for transferring data with URLs',
  dig: 'DNS lookup utility',
  htop: 'Interactive process viewer',
  iperf2: 'Network bandwidth measurement tool (v2)',
  iperf3: 'Network bandwidth measurement tool (v3)',
  jq: 'Command-line JSON processor',
  rsync: 'Fast file copying/sync tool',
  scp: 'Secure file copy over SSH',
  sftp: 'Secure file transfer over SSH',
  ssh: 'Secure shell client',
  'ssh-keygen': 'SSH key generator',
  'ssh-keyscan': 'SSH public key scanner',
  tcpdump: 'Network packet analyzer',
  hello: 'Test package',
  ezupdate: 'Cek update image EZOS terbaru dari GHCR',
  ezinfo: 'Show EZOS system info and credits',
  fastfetch: 'Fast system information tool'
};

const PKG_ICONS = {
  curl:'🌐', dig:'📡', htop:'📊', iperf2:'📶', iperf3:'📶', jq:'🧩',
  rsync:'♻️', scp:'📤', sftp:'📁', ssh:'🔐', 'ssh-keygen':'🔑',
  'ssh-keyscan':'🛰️', tcpdump:'🕵️', hello:'👋', ezupdate:'🔄',
  ezinfo:'💠', fastfetch:'🖥️'
};

const PKG = {
  BASE: PKG_BASE,
  index: null,
  indexAt: 0,
  offline: false,
  installed: {},

  load(){
    try {
      const data = JSON.parse(localStorage.getItem('ezos.pkgs.v1') || '{}');
      this.installed = data && typeof data === 'object' ? data : {};
    } catch(e){ this.installed = {}; }
  },

  save(){
    try { localStorage.setItem('ezos.pkgs.v1', JSON.stringify(this.installed)); } catch(e){}
    this.mirror();
  },

  /* Keep a readable manifest inside the virtual filesystem: /var/lib/ezpkg */
  mirror(){
    try {
      if(!FS.node('/var/lib')) FS.mkdir('/var/lib');
      if(!FS.node('/var/lib/ezpkg')) FS.mkdir('/var/lib/ezpkg');
      const dir = '/var/lib/ezpkg';
      const manifest = {};
      for(const [name, meta] of Object.entries(this.installed)){
        manifest[name] = { installedAt: new Date(meta.at).toISOString(), size: meta.size };
        if(!FS.node(`${dir}/${name}.json`)){
          FS.write(`${dir}/${name}.json`, JSON.stringify({
            name,
            description: (this.index && this.index[name]) || (PKG_FALLBACK[name] || ''),
            installedAt: new Date(meta.at).toISOString(),
            size: meta.size,
            source: `${this.BASE}/${name}.tar.gz`
          }, null, 2));
        }
      }
      FS.write(`${dir}/installed.json`, JSON.stringify(manifest, null, 2));
      const d = FS.node(dir);
      if(d && d.children){
        Object.keys(d.children).forEach(f => {
          if(f.endsWith('.json') && f !== 'installed.json' && !this.installed[f.slice(0, -5)]){
            FS.rm(`${dir}/${f}`);
          }
        });
      }
    } catch(e){}
  },

  isInstalled(name){ return !!this.installed[name]; },
  list(){ return Object.keys(this.installed).sort(); },

  async fetchIndex(force=false){
    if(!force && this.index && Date.now() - this.indexAt < 5 * 60 * 1000) return this.index;
    try {
      const res = await fetch(`${this.BASE}/index.json?t=${Date.now()}`, { cache:'no-store' });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if(!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('invalid index');
      this.index = data;
      this.offline = false;
    } catch(e){
      this.index = { ...PKG_FALLBACK };
      this.offline = true;
    }
    this.indexAt = Date.now();
    return this.index;
  },

  async sizeOf(name){
    try {
      const res = await fetch(`${this.BASE}/${encodeURIComponent(name)}.tar.gz`, { method:'HEAD', cache:'no-store' });
      if(!res.ok) return null;
      const n = Number(res.headers.get('content-length'));
      return Number.isFinite(n) && n > 0 ? n : null;
    } catch(e){ return null; }
  },

  async install(name){
    const idx = await this.fetchIndex();
    if(!Object.prototype.hasOwnProperty.call(idx, name)) throw new Error(`package '${name}' not found`);
    if(this.installed[name]) return { already:true, size:this.installed[name].size };
    const size = await this.sizeOf(name);
    this.installed[name] = { at: Date.now(), size };
    this.save();
    return { size };
  },

  remove(name){
    if(!this.installed[name]) return false;
    delete this.installed[name];
    this.save();
    return true;
  }
};
PKG.load();

function fmtBytes(n){
  if(n == null || !Number.isFinite(Number(n))) return '—';
  n = Number(n);
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function toast(msg, icon='✓'){
  const t = el('div', 'toast', `<span>${esc(icon)}</span><span>${esc(msg)}</span>`);
  $('#toasts').appendChild(t);
