function dialogPrompt({ title='Input', message='', value='', placeholder='', okText='OK', cancelText='Cancel' } = {}){
  return new Promise(resolve => {
    const ov = el('div', 'dialog-overlay');
    ov.innerHTML = `
      <div class="dialog" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        ${message ? `<p>${esc(message)}</p>` : ''}
        <input type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" spellcheck="false">
        <div class="btns">
          <button class="btn cancel">${esc(cancelText)}</button>
          <button class="btn primary ok">${esc(okText)}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    const input = ov.querySelector('input');
    let closed = false;
    const done = v => {
      if(closed) return;
      closed = true;
      document.removeEventListener('keydown', onKey);
      ov.remove();
      resolve(v);
    };
    const onKey = e => {
      if(e.key === 'Escape'){ e.preventDefault(); done(null); }
      else if(e.key === 'Enter'){ e.preventDefault(); done(input.value.trim() || null); }
    };
    document.addEventListener('keydown', onKey);
    ov.querySelector('.ok').onclick = () => done(input.value.trim() || null);
    ov.querySelector('.cancel').onclick = () => done(null);
    ov.addEventListener('pointerdown', e => { if(e.target === ov) done(null); });
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}

function dialogConfirm({ title='Are you sure?', message='', okText='Confirm', danger=true } = {}){
  return new Promise(resolve => {
    const ov = el('div', 'dialog-overlay');
    ov.innerHTML = `
      <div class="dialog" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        ${message ? `<p>${esc(message)}</p>` : ''}
        <div class="btns">
          <button class="btn cancel">Cancel</button>
          <button class="btn ${danger ? 'danger' : 'primary'} ok">${esc(okText)}</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    let closed = false;
    const done = v => {
      if(closed) return;
      closed = true;
      document.removeEventListener('keydown', onKey);
      ov.remove();
      resolve(v);
    };
    const onKey = e => {
      if(e.key === 'Escape'){ e.preventDefault(); done(false); }
      else if(e.key === 'Enter'){ e.preventDefault(); done(true); }
    };
    document.addEventListener('keydown', onKey);
    ov.querySelector('.ok').onclick = () => done(true);
    ov.querySelector('.cancel').onclick = () => done(false);
    ov.addEventListener('pointerdown', e => { if(e.target === ov) done(false); });
  });
}

/* ---------------- window manager ---------------- */
const WM = {
  windows: new Map(),
  seq: 0,
  z: 100,

  spawn(opts){
    const { appId, title, icon, width=720, height=480, x, y, onOpen } = opts;
    const id = 'w' + (++this.seq);

    let w = Math.min(width, Math.max(320, window.innerWidth - 24));
    let h = Math.min(height, Math.max(220, window.innerHeight - 32 - 52));

    const elWin = document.createElement('div');
    elWin.className = 'window';
    elWin.tabIndex = -1;
    const casc = (this.seq - 1) % 6;
    const left = x ?? Math.max(8, Math.min(24 + casc * 26, window.innerWidth - w - 16));
    const top  = y ?? Math.max(8, Math.min(20 + casc * 22, window.innerHeight - h - 92));
    elWin.style.width = w + 'px';
    elWin.style.height = h + 'px';
    elWin.style.left = left + 'px';
    elWin.style.top = top + 'px';
    elWin.innerHTML = `
      <div class="win-titlebar">
        <span class="win-ico">${icon}</span>
        <span class="win-title"></span>
        <div class="win-controls">
          <button class="wbtn min" title="Minimize">–</button>
          <button class="wbtn max" title="Maximize">▢</button>
          <button class="wbtn close" title="Close">✕</button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="rz"></div>`;
    $('#windows').appendChild(elWin);

    const task = document.createElement('button');
    task.className = 'titem';
    task.innerHTML = `<span class="ico">${icon}</span><span class="lbl"></span>`;
    task.querySelector('.lbl').textContent = title;
    $('#tasklist').appendChild(task);

    const win = {
      id, appId, el: elWin,
      body: elWin.querySelector('.win-body'),
      titleEl: elWin.querySelector('.win-title'),
      task, taskLabel: task.querySelector('.lbl'),
      minimized: false, maximized: false, restore: null,
      onClose: []
    };
    win.titleEl.textContent = title;
    win.title = title;
    win.setTitle = t => {
      win.title = t;
      win.titleEl.textContent = t;
      win.taskLabel.textContent = t;
    };
    this.windows.set(id, win);

    /* focus on any interaction */
    elWin.addEventListener('pointerdown', () => this.focus(win), true);

    /* titlebar controls */
    elWin.querySelector('.min').addEventListener('click', e => { e.stopPropagation(); this.minimize(win); });
    elWin.querySelector('.max').addEventListener('click', e => { e.stopPropagation(); this.toggleMax(win); });
    elWin.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); this.close(win); });

    task.addEventListener('click', () => {
      if(win.minimized) this.focus(win);
      else if(elWin.classList.contains('active')) this.minimize(win);
      else this.focus(win);
    });

    /* dragging */
    const tb = elWin.querySelector('.win-titlebar');
    let drag = null;
    tb.addEventListener('pointerdown', e => {
      if(e.target.closest('.win-controls') || win.maximized) return;
      drag = { sx:e.clientX, sy:e.clientY, ox:elWin.offsetLeft, oy:elWin.offsetTop, pid:e.pointerId };
      try { tb.setPointerCapture(e.pointerId); } catch(err){}
      document.body.classList.add('dragging');
    });
    tb.addEventListener('pointermove', e => {
      if(!drag || e.pointerId !== drag.pid) return;
      const nx = drag.ox + (e.clientX - drag.sx);
      const ny = drag.oy + (e.clientY - drag.sy);
      const maxX = window.innerWidth - 64;
      const maxY = window.innerHeight - 52 - 40;
      elWin.style.left = Math.min(Math.max(-elWin.offsetWidth + 84, nx), maxX) + 'px';
      elWin.style.top  = Math.min(Math.max(0, ny), maxY) + 'px';
    });
    const endDrag = e => {
      if(drag && e && e.pointerId !== undefined && e.pointerId !== drag.pid) return;
      drag = null;
      document.body.classList.remove('dragging');
    };
    tb.addEventListener('pointerup', endDrag);
    tb.addEventListener('pointercancel', endDrag);
    tb.addEventListener('lostpointercapture', () => endDrag());
    tb.addEventListener('dblclick', e => {
      if(e.target.closest('.win-controls')) return;
      this.toggleMax(win);
    });

    /* resizing */
    const rz = elWin.querySelector('.rz');
    let rsz = null;
    rz.addEventListener('pointerdown', e => {
      e.stopPropagation();
      if(win.maximized) return;
      rsz = { sx:e.clientX, sy:e.clientY, w:elWin.offsetWidth, h:elWin.offsetHeight, pid:e.pointerId };
      try { rz.setPointerCapture(e.pointerId); } catch(err){}
    });
    rz.addEventListener('pointermove', e => {
      if(!rsz || e.pointerId !== rsz.pid) return;
      elWin.style.width = Math.max(320, rsz.w + e.clientX - rsz.sx) + 'px';
      elWin.style.height = Math.max(200, rsz.h + e.clientY - rsz.sy) + 'px';
    });
    const endRsz = () => { rsz = null; };
    rz.addEventListener('pointerup', endRsz);
    rz.addEventListener('pointercancel', endRsz);

    /* build content */
    if(typeof onOpen === 'function'){
      try { onOpen(win); } catch(err){ console.error(err); }
    }

    if(window.innerWidth < 720) this.toggleMax(win);
    this.focus(win);
    return win;
  },

  focus(win){
    if(!win || !this.windows.has(win.id)) return;
    if(win.minimized){ win.minimized = false; win.el.style.display = 'flex'; }
    if(Number(win.el.style.zIndex) === this.z && win.el.classList.contains('active')) return;
    win.el.style.zIndex = ++this.z;
    this.windows.forEach(w => {
      const on = w === win;
      w.el.classList.toggle('active', on);
      w.task.classList.toggle('active', on);
    });
    try { win.el.focus({ preventScroll: true }); } catch(e){}
  },

  minimize(win){
    win.minimized = true;
    win.el.style.display = 'none';
    win.el.classList.remove('active');
    win.task.classList.remove('active');
  },

  toggleMax(win){
    const elWin = win.el;
    if(!win.maximized){
      win.restore = { left: elWin.style.left, top: elWin.style.top, width: elWin.style.width, height: elWin.style.height };
      win.maximized = true;
      elWin.classList.add('maxed');
      elWin.style.left = '0px';
      elWin.style.top = '0px';
      elWin.style.width = '100%';
      elWin.style.height = '100%';
    } else {
      win.maximized = false;
      elWin.classList.remove('maxed');
      if(win.restore){
        elWin.style.left = win.restore.left;
        elWin.style.top = win.restore.top;
        elWin.style.width = win.restore.width;
        elWin.style.height = win.restore.height;
      }
    }
    window.dispatchEvent(new Event('ezos:winresize'));
  },

  close(win){
    if(!win || !this.windows.has(win.id)) return;
    win.onClose.forEach(fn => { try { fn(); } catch(e){} });
    win.el.remove();
    win.task.remove();
    this.windows.delete(win.id);
  }
};

/* ---------------- app: terminal ---------------- */
function openTerminal(win){
  const term = el('div', 'term');
  term.innerHTML = `
    <div class="term-out"></div>
    <div class="term-line"><span class="term-prompt"></span><input class="term-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input"></div>`;
  win.body.appendChild(term);

  const out = term.querySelector('.term-out');
  const input = term.querySelector('.term-in');
  const promptEl = term.querySelector('.term-prompt');
  let cwd = '/home/user';
  const history = [];
  let hIdx = 0;

  const promptText = () => `user@ezos:${cwd === '/home/user' ? '~' : cwd}$`;
  const refreshPrompt = () => { promptEl.textContent = promptText(); };
  const print = (html='') => {
    out.insertAdjacentHTML('beforeend', html + '\n');
    out.scrollTop = out.scrollHeight;
  };
  const err = m => `<span class="err">${esc(m)}</span>`;
  const ok  = m => `<span class="ok">${esc(m)}</span>`;
  const dim = m => `<span class="dim">${esc(m)}</span>`;
  const D   = m => `<span class="d">${esc(m)}</span>`;

  print(`<span class="d">EZOS 3.0</span> <span class="dim">— Web Edition</span>`);
  print(`<span class="dim">kernel ezos-js 3.0 · shell ezsh · ${window.innerWidth}×${window.innerHeight}</span>`);
  print(`Type <span class="ok">help</span> to see available commands.`);
  print('');
  refreshPrompt();
  setTimeout(() => input.focus(), 40);

  term.addEventListener('pointerup', () => {
    if(!String(window.getSelection())) input.focus();
  });

  function helpText(){
    const rows = [
      ['help','Show this help'],
      ['ls [path]','List directory contents'],
      ['cd [path]','Change directory'],
      ['pwd','Print working directory'],
      ['cat <file>','Print file contents'],
      ['mkdir <dir>','Create directory'],
      ['touch <file>','Create empty file'],
      ['rm [-r] <path>','Remove file or directory'],
      ['echo <text> [> file]','Print text or write to file'],
      ['tree [path]','Show directory tree'],
      ['clear','Clear the screen'],
      ['neofetch','System information'],
      ['date','Show date and time'],
      ['whoami','Show current user'],
      ['uname [-a]','System name'],
      ['open <app>','Launch an app'],
      ['ezpkg <cmd>','Package manager (ezos-repo)'],
      ['cowsay <text>','Moo.'],
      ['theme [name]','Change color theme'],
      ['wallpaper [name]','Change wallpaper'],
      ['history','Command history'],
      ['reboot','Restart EZOS'],
      ['exit','Close this terminal']
    ];
    rows.forEach(([c, d]) => print(`<span class="ok">${esc(pad(c, 26))}</span><span class="dim">${esc(d)}</span>`));
    print('');
    print(dim("Installed packages add commands: try 'ezpkg install fastfetch' or open Store."));
  }

  function treeText(node, prefix='', depth=0){
    if(depth > 5 || !node || node.type !== 'dir') return '';
    const entries = Object.entries(node.children).sort((a, b) => {
      const ad = a[1].type === 'dir', bd = b[1].type === 'dir';
      if(ad !== bd) return ad ? -1 : 1;
      return a[0].localeCompare(b[0]);
    });
    let txt = '';
    entries.forEach(([name, child], i) => {
      const last = i === entries.length - 1;
      txt += prefix + (last ? '└── ' : '├── ') + name + (child.type === 'dir' ? '/' : '') + '\n';
      if(child.type === 'dir') txt += treeText(child, prefix + (last ? '    ' : '│   '), depth + 1);
    });
    return txt;
  }

  async function ezpkgCmd(args){
    const sub = (args[0] || 'help').toLowerCase();
    try {
      if(sub === 'help' || sub === '--help' || sub === '-h'){
        const rows = [
          ['list-remote','List available packages'],
          ['search <q>','Search by name or description'],
          ['info <pkg>','Show package details'],
          ['install <pkg>...','Install one or more packages'],
          ['remove <pkg>...','Remove installed packages'],
          ['list','Show installed packages'],
          ['update','Refresh the package index'],
          ['repo','Show the configured repository'],
          ['version','Show ezpkg version']
        ];
        print('Usage: ezpkg <command> [args]');
        rows.forEach(([c, d]) => print(`<span class="ok">${esc(pad('  ' + c, 26))}</span><span class="dim">${esc(d)}</span>`));
        return;
      }

      if(sub === 'version' || sub === '-v'){
        print('ezpkg 1.0-web (EZOS 3.0)');
        return;
      }

      if(sub === 'repo'){
        print(`repo: ${esc(PKG.BASE)}`);
        print(dim(`source: ${PKG_REPO_URL}`));
        return;
      }

      if(sub === 'list' || sub === 'installed'){
        const list = PKG.list();
        if(!list.length){ print(dim("No packages installed. Try: ezpkg install fastfetch")); return; }
        for(const name of list){
          const meta = PKG.installed[name] || {};
          print(`<span class="ok">✓</span> ${esc(pad(name, 16))} <span class="dim">${esc(fmtBytes(meta.size))}</span>`);
        }
        print(dim(`${list.length} package(s) installed · manifests in /var/lib/ezpkg`));
        return;
      }

      if(sub === 'list-remote' || sub === 'search'){
        print(dim('Fetching index…'));
        const idx = await PKG.fetchIndex();
        const q = sub === 'search' ? (args[1] || '').toLowerCase() : '';
        const names = Object.keys(idx).filter(name =>
          !q || name.toLowerCase().includes(q) || String(idx[name]).toLowerCase().includes(q)
        ).sort();
        if(!names.length){ print(err(`ezpkg: no packages match '${args[1] || ''}'`)); return; }
        for(const name of names){
          const installed = PKG.isInstalled(name);
          print(`${installed ? '<span class="ok">●</span>' : '<span class="dim">○</span>'} <span class="${installed ? 'ok' : ''}">${esc(pad(name, 16))}</span> <span class="dim">${esc(idx[name])}</span>`);
        }
        print(dim(`${names.length} package(s) · ${PKG.offline ? 'offline fallback index' : 'ezos-repo/main'}`));
        return;
      }

      if(sub === 'info'){
        const name = args[1];
        if(!name){ print(err('usage: ezpkg info <pkg>')); return; }
        print(dim('Fetching index…'));
        const idx = await PKG.fetchIndex();
        if(!Object.prototype.hasOwnProperty.call(idx, name)){ print(err(`ezpkg: ${name}: package not found`)); return; }
        print(`<span class="ok">${esc(name)}</span> <span class="dim">— ${esc(idx[name])}</span>`);
        print(`Installed : ${PKG.isInstalled(name) ? 'yes' : 'no'}`);
        if(PKG.isInstalled(name)) print(`Size      : ${esc(fmtBytes(PKG.installed[name].size))}`);
        print(`Package   : ${esc(`${PKG.BASE}/${name}.tar.gz`)}`);
        print(`Command   : ${PKG_CMDS[name] ? 'adds the ' + esc(name) + ' command' : 'no command registration'}`);
        return;
      }

      if(sub === 'install'){
        const names = args.slice(1);
        if(!names.length){ print(err('usage: ezpkg install <pkg>...')); return; }
        print(dim('Fetching index…'));
        const idx = await PKG.fetchIndex();
        for(const name of names){
          if(!Object.prototype.hasOwnProperty.call(idx, name)){ print(err(`ezpkg: ${name}: package not found`)); continue; }
          if(PKG.isInstalled(name)){ print(dim(`${name}: already installed`)); continue; }
          print(dim(`Downloading ${name}.tar.gz…`));
          const res = await PKG.install(name);
          print(`<span class="ok">✓</span> ${esc(name)} ${esc(fmtBytes(res.size))} <span class="dim">installed</span>`);
        }
        const ready = names.filter(n => PKG.isInstalled(n) && PKG_CMDS[n]);
        if(ready.length) print(dim(`new command(s): ${ready.join(', ')}`));
        return;
      }

      if(sub === 'remove' || sub === 'uninstall'){
        const names = args.slice(1);
        if(!names.length){ print(err('usage: ezpkg remove <pkg>...')); return; }
        for(const name of names){
          if(PKG.remove(name)) print(`<span class="ok">✓</span> ${esc(name)} removed`);
          else print(dim(`${name}: not installed`));
        }
        return;
      }

      if(sub === 'update' || sub === 'refresh'){
        print(dim('Fetching index…'));
        const idx = await PKG.fetchIndex(true);
        print(ok(`index updated — ${Object.keys(idx).length} package(s)`));
        if(PKG.offline) print(dim('network unavailable, using the built-in offline index'));
        return;
      }

      if(sub === 'clean'){
        print(dim('package cache is clean'));
        return;
      }

      print(err(`ezpkg: unknown command '${sub}'`));
      print(dim("run 'ezpkg help'"));
    } catch(e){
      print(err('ezpkg: ' + (e && e.message ? e.message : 'network error')));
      print(dim('check your connection — the store has an offline fallback index'));
    }
  }

  async function run(raw){
    const line = raw.trim();
    const tokens = tokenize(line);
    const cmd = tokens[0] || '';
    const args = tokens.slice(1);

    if(!cmd) return;

    const dynamic = PKG_CMDS[cmd];
    if(dynamic){
      if(!PKG.isInstalled(dynamic.pkg)){
        print(err(`${cmd}: command not found (package '${dynamic.pkg}' is not installed)`));
        print(dim(`install it with: ezpkg install ${dynamic.pkg}`));
        return;
      }
      await dynamic.run(args, { print, err, ok, dim, D, cwd });
      return;
    }

    switch(cmd){
      case 'help': helpText(); break;

      case 'ezpkg': await ezpkgCmd(args); break;

      case 'ls': {
        const target = args[0] ? FS.norm(args[0], cwd) : cwd;
        const node = FS.node(target);
        if(!node){ print(err(`ls: ${target}: No such file or directory`)); break; }
        if(node.type !== 'dir'){ print(esc(target)); break; }
        const names = FS.list(target);
        if(!names || !names.length){ print(dim('(empty)')); break; }
        print(names.map(([n, c]) => c.type === 'dir' ? `<span class="d">${esc(n)}/</span>` : esc(n)).join('   '));
        break;
      }

      case 'cd': {
        const target = FS.norm(args[0] || '/home/user', cwd);
        const node = FS.node(target);
        if(!node){ print(err(`cd: ${args[0] || target}: No such file or directory`)); break; }
        if(node.type !== 'dir'){ print(err(`cd: ${args[0] || target}: Not a directory`)); break; }
        cwd = target; refreshPrompt(); break;
      }

      case 'pwd': print(esc(cwd)); break;

      case 'cat': {
        if(!args[0]){ print(err('usage: cat <file>')); break; }
        const target = FS.norm(args[0], cwd);
        const node = FS.node(target);
        if(!node){ print(err(`cat: ${args[0]}: No such file or directory`)); break; }
        if(node.type === 'dir'){ print(err(`cat: ${args[0]}: Is a directory`)); break; }
        if(dataURL(node)){ print(dim(`[image file ${Math.round((node.content.length*3)/4/1024)} KB]`)); break; }
        print(esc(node.content || ''));
        break;
      }

      case 'mkdir': {
        if(!args[0]){ print(err('usage: mkdir <dir>')); break; }
        for(const a of args){
          const r = FS.mkdir(FS.norm(a, cwd));
          if(!r.ok) print(err(`mkdir: ${a}: ${r.err}`));
        }
        break;
      }

      case 'touch': {
        if(!args[0]){ print(err('usage: touch <file>')); break; }
        for(const a of args){
          const p = FS.norm(a, cwd);
          const n = FS.node(p);
          if(n && n.type === 'file'){ n.modified = Date.now(); FS.save(); }
          else if(n && n.type === 'dir'){ print(err(`touch: ${a}: Is a directory`)); }
          else {
            const r = FS.write(p, '');
            if(!r.ok) print(err(`touch: ${a}: ${r.err}`));
          }
        }
        break;
      }

      case 'rm': {
        const recursive = args.some(a => /^-r/.test(a));
        const targets = args.filter(a => !a.startsWith('-'));
        if(!targets.length){ print(err('usage: rm [-r] <path>')); break; }
        for(const a of targets){
          const p = FS.norm(a, cwd);
          if(p === '/'){ print(err('rm: cannot remove root')); continue; }
          if(cwd === p || cwd.startsWith(p + '/')){ print(err(`rm: ${a}: Cannot remove current directory`)); continue; }
          const node = FS.node(p);
          if(!node){ print(err(`rm: ${a}: No such file or directory`)); continue; }
          if(node.type === 'dir'){
            if(!recursive){ print(err(`rm: ${a}: Is a directory (use -r)`)); continue; }
          }
          const r = FS.rm(p);
          if(!r.ok) print(err(`rm: ${a}: ${r.err}`));
        }
        break;
      }

      case 'echo': {
        const gt = args.findIndex(a => a === '>' || a === '>>');
        if(gt >= 0){
          const content = args.slice(0, gt).join(' ');
          const fileArg = args[gt + 1];
          if(!fileArg){ print(err('usage: echo <text> > <file>')); break; }
          const p = FS.norm(fileArg, cwd);
          const append = args[gt] === '>>';
          const prev = append ? (FS.read(p) || '') : '';
          const r = FS.write(p, prev + content + (append ? '\n' : ''));
          if(!r.ok) print(err(`echo: ${fileArg}: ${r.err}`));
        } else {
          print(esc(args.join(' ')));
        }
        break;
      }

      case 'tree': {
        const target = args[0] ? FS.norm(args[0], cwd) : cwd;
        const node = FS.node(target);
        if(!node){ print(err(`tree: ${target}: No such file or directory`)); break; }
        if(node.type !== 'dir'){ print(esc(target)); break; }
        print(D(target));
        const txt = treeText(node);
        if(txt) print(esc(txt.replace(/\n$/, '')));
        break;
      }

      case 'clear': out.innerHTML = ''; refreshPrompt(); return;

      case 'neofetch': {
        const art = [
          '███████╗███████╗ ██████╗ ███████╗',
          '██╔════╝╚══███╔╝██╔═══██╗██╔════╝',
          '█████╗    ███╔╝ ██║   ██║███████╗',
          '██╔══╝   ███╔╝  ██║   ██║╚════██║',
          '███████╗███████╗╚██████╔╝███████║',
          '╚══════╝╚══════╝ ╚═════╝ ╚══════╝'
        ];
        art.forEach(l => print(`<span class="d">${esc(l)}</span>`));
        print('');
        print(`<span class="ok">user@ezos</span>`);
        print(dim('─────────────'));
        print(`OS        ${esc('EZOS 3.0 Web Edition')}`);
        print(`Kernel    ${esc('ezos-js 3.0')}`);
        print(`Shell     ${esc('ezsh')}`);
        print(`Uptime    ${esc(fmtUptime(Date.now() - SESSION_START))}`);
        print(`Theme     ${esc(settings.theme)}`);
        print(`Wallpaper ${esc(settings.wallpaper)}`);
        print(`Resolution ${window.innerWidth}×${window.innerHeight}`);
        print(`Engine    ${esc(navigator.userAgent.includes('Firefox') ? 'Firefox' : navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome') ? 'Safari' : 'Chromium')}`);
        break;
      }

      case 'date': print(esc(new Date().toString())); break;
      case 'whoami': print('user'); break;
      case 'uname': print(args.includes('-a') ? esc('EZOS ezos 3.0-web ezos-js #1 SMP WebAssembly') : 'EZOS'); break;

      case 'open': {
        const id = args[0];
        if(!id){ print(dim('apps: ' + Object.keys(APPS).filter(k => !APPS[k].hidden).join(', '))); break; }
        if(!APPS[id]){ print(err(`open: unknown app '${id}'`)); break; }
        openApp(id);
        break;
      }

      case 'cowsay': print(esc('🐄 ' + (args.join(' ') || 'moo'))); break;

      case 'theme': {
        const name = args[0];
        if(!name){ print(dim('themes: ' + Object.keys(THEMES).join(', '))); break; }
        if(!THEMES[name]){ print(err(`theme: unknown '${name}'`)); break; }
        applyTheme(name);
        print(ok(`theme set to ${name}`));
        toast(`Theme: ${name}`, '🎨');
        break;
      }

      case 'wallpaper': {
        const name = args[0];
        if(!name){ print(dim('wallpapers: ' + Object.keys(WALLPAPERS).join(', '))); break; }
        if(!WALLPAPERS[name]){ print(err(`wallpaper: unknown '${name}'`)); break; }
        applyWallpaper(name);
        print(ok(`wallpaper set to ${name}`));
        toast(`Wallpaper: ${name}`, '🖼️');
        break;
      }

      case 'history':
        if(!history.length){ print(dim('(no history)')); break; }
        print(history.map((h, i) => `${String(i + 1).padStart(3)}  ${esc(h)}`).join('\n'));
        break;

      case 'sudo': print(err('user is not in the sudoers file. This incident has been reported.')); break;

      case 'reboot':
        print(dim('Broadcast message: system is going down for reboot NOW!'));
        setTimeout(() => location.reload(), 700);
        break;

      case 'exit': WM.close(win); break;

      default:
        print(err(`ezsh: command not found: ${cmd}`));
        print(dim("type 'help' for a list of commands"));
    }
  }

  let busy = false;
  async function submit(){
    if(busy) return;
    const raw = input.value;
    input.value = '';
    if(raw.trim()){
      history.push(raw.trim());
      hIdx = history.length;
    }
    print(`<span class="p">${esc(promptText())}</span> ${esc(raw)}`);
    busy = true;
    try { await run(raw); }
    finally { busy = false; }
    print('');
    refreshPrompt();
    out.scrollTop = out.scrollHeight;
  }

  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); submit(); }
    else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(history.length && hIdx > 0){ hIdx--; input.value = history[hIdx]; setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0); }
    }
    else if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(hIdx < history.length - 1){ hIdx++; input.value = history[hIdx]; }
      else { hIdx = history.length; input.value = ''; }
    }
    else if(e.ctrlKey && e.key.toLowerCase() === 'l'){ e.preventDefault(); out.innerHTML = ''; }
  });

  win.setTitle('Terminal');
}

/* ---------------- app: files ---------------- */
function openFiles(win, opts={}){
  let dir = opts.path || '/home/user';
  const hist = [];

  const wrap = el('div', 'files');
  wrap.innerHTML = `
    <div class="files-top">
      <button class="icon-btn" data-a="back" title="Back">←</button>
      <button class="icon-btn" data-a="up" title="Up">↑</button>
      <div class="crumbs"></div>
      <button class="icon-btn" data-a="newfolder">＋ Folder</button>
      <button class="icon-btn" data-a="newfile">＋ File</button>
      <button class="icon-btn" data-a="del" title="Delete selected">🗑</button>
    </div>
    <div class="files-main">
      <div class="sidebar"></div>
      <div class="files-grid"></div>
    </div>`;
  win.body.appendChild(wrap);

  const crumbs = wrap.querySelector('.crumbs');
  const grid = wrap.querySelector('.files-grid');
  const sidebar = wrap.querySelector('.sidebar');
  let selected = null;

  const QUICK = [
    ['🏠','Home','/home/user'],
    ['📄','Documents','/home/user/Documents'],
    ['🖼️','Pictures','/home/user/Pictures'],
    ['🎵','Music','/home/user/Music'],
    ['💽','Root','/'],
    ['⚙️','etc','/etc']
  ];
  QUICK.forEach(([ic, label, path]) => {
    const b = document.createElement('button');
    b.className = 'side-item';
    b.innerHTML = `<span>${ic}</span><span>${esc(label)}</span>`;
    b.dataset.path = path;
    b.addEventListener('click', () => go(path));
    sidebar.appendChild(b);
  });

  function go(path, push=true){
    const node = FS.node(path);
    if(!node || node.type !== 'dir'){ toast('Folder not found: ' + path, '⚠️'); return; }
    if(push && path !== dir) hist.push(dir);
    dir = path;
    selected = null;
    render();
  }
  function back(){ if(hist.length){ dir = hist.pop(); selected = null; render(); } }

  function openItem(name, node){
    const path = FS.norm(name, dir);
    if(node.type === 'dir'){ go(path); return; }
    if(dataURL(node)) openApp('preview', { path });
    else openApp('editor', { path });
  }

  function render(){
    const node = FS.node(dir);
    if(!node || node.type !== 'dir'){ dir = '/home/user'; return render(); }

    /* title + crumbs */
    const short = dir === '/' ? '/' : dir.split('/').pop();
    win.setTitle('Files — ' + short);

    crumbs.innerHTML = '';
    const rootB = document.createElement('span');
    rootB.className = 'crumb';
    rootB.textContent = '/';
    rootB.addEventListener('click', () => go('/'));
    crumbs.appendChild(rootB);

    let acc = '';
    dir.split('/').filter(Boolean).forEach((seg, i, arr) => {
      acc += '/' + seg;
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '›';
      crumbs.appendChild(sep);
      const b = document.createElement('span');
      b.className = 'crumb';
      b.textContent = seg;
      const target = acc;
      b.addEventListener('click', () => go(target));
      crumbs.appendChild(b);
    });

    /* sidebar state */
    $$('.side-item', sidebar).forEach(b => b.classList.toggle('active', b.dataset.path === dir));

    /* grid */
    grid.innerHTML = '';
    const entries = FS.list(dir) || [];
    if(!entries.length){
      grid.appendChild(el('div', 'files-empty', 'This folder is empty.'));
      return;
    }

    entries.forEach(([name, child]) => {
      const item = el('div', 'fitem');
      const icon = child.type === 'dir' ? '📁' : dataURL(child) ? '🖼️' : '📄';
      item.innerHTML = `<div class="fi">${icon}</div><div class="fn">${esc(name)}</div>`;
      if(name === selected) item.classList.add('sel');

      item.addEventListener('pointerdown', e => {
        e.stopPropagation();
        selected = name;
        $$('.fitem', grid).forEach(x => x.classList.remove('sel'));
        item.classList.add('sel');
      });

      let lastTap = 0;
      item.addEventListener('pointerup', () => {
        const t = Date.now();
        if(t - lastTap < 340){ lastTap = 0; openItem(name, child); }
        else lastTap = t;
      });

      grid.appendChild(item);
    });
  }

  wrap.querySelector('[data-a=back]').addEventListener('click', back);
  wrap.querySelector('[data-a=up]').addEventListener('click', () => {
    const p = FS.parent(dir);
    if(p) go(p.path, false); else go('/', false);
  });
  wrap.querySelector('[data-a=newfolder]').addEventListener('click', async () => {
    const name = await dialogPrompt({ title:'New Folder', message:`Create inside ${dir}`, value:'New Folder', okText:'Create' });
    if(!name) return;
    const r = FS.mkdir(FS.norm(name, dir));
    if(!r.ok){ toast(r.err, '⚠️'); return; }
    toast('Folder created', '📁');
    render();
  });
  wrap.querySelector('[data-a=newfile]').addEventListener('click', async () => {
    const name = await dialogPrompt({ title:'New File', message:`Create inside ${dir}`, value:'untitled.txt', okText:'Create' });
    if(!name) return;
    const r = FS.write(FS.norm(name, dir), '');
    if(!r.ok){ toast(r.err, '⚠️'); return; }
    toast('File created', '📄');
    render();
  });
  wrap.querySelector('[data-a=del]').addEventListener('click', async () => {
    if(!selected){ toast('Select a file or folder first', '⚠️'); return; }
    const target = FS.norm(selected, dir);
    const yes = await dialogConfirm({ title:'Delete?', message:`Delete "${selected}" permanently?`, okText:'Delete' });
    if(!yes) return;
    const r = FS.rm(target);
    if(!r.ok){ toast(r.err, '⚠️'); return; }
    selected = null;
    toast('Deleted', '🗑');
    render();
  });

  render();
}

/* ---------------- app: editor ---------------- */
function openEditor(win, opts={}){
  let path = opts.path || null;
  let dirty = false;

  const wrap = el('div', 'editor');
  wrap.innerHTML = `
    <div class="ed-top">
      <button class="icon-btn" data-a="save">💾 Save</button>
      <button class="icon-btn" data-a="open">📂 Open</button>
      <input class="ed-path" spellcheck="false" aria-label="File path">
    </div>
    <textarea class="ed-area" spellcheck="false" placeholder="Start typing…"></textarea>
    <div class="ed-status"><span class="ln">Ln 1, Col 1</span><span class="wc">0 chars</span><span class="dirty"></span></div>`;
  win.body.appendChild(wrap);

  const pathInput = wrap.querySelector('.ed-path');
  const area = wrap.querySelector('.ed-area');
  const lnEl = wrap.querySelector('.ln');
  const wcEl = wrap.querySelector('.wc');
  const dirtyEl = wrap.querySelector('.dirty');

  pathInput.value = path || '/home/user/untitled.txt';

  function load(p){
    const n = FS.node(p);
    if(!n){ toast('File not found: ' + p, '⚠️'); return; }
    if(n.type === 'dir'){ toast('That is a folder', '⚠️'); return; }
    if(dataURL(n)){ toast('Cannot edit images here', '⚠️'); return; }
    path = p;
    pathInput.value = p;
    area.value = n.content || '';
    dirty = false;
    updateTitle();
    updateStatus();
  }

  function updateTitle(){
    const name = path ? path.split('/').pop() : 'untitled.txt';
    win.setTitle('Editor — ' + name);
    dirtyEl.textContent = dirty ? '● unsaved' : '';
  }

  function updateStatus(){
    const v = area.value;
    const pos = area.selectionStart || 0;
    const before = v.slice(0, pos);
    const ln = before.split('\n').length;
    const col = pos - before.lastIndexOf('\n');
    lnEl.textContent = `Ln ${ln}, Col ${col}`;
    wcEl.textContent = `${v.length} chars · ${v ? v.split('\n').length : 1} lines`;
    dirtyEl.textContent = dirty ? '● unsaved' : '';
  }

  function save(){
    let p = pathInput.value.trim() || path || '/home/user/untitled.txt';
    if(!p.startsWith('/')) p = FS.norm(p, '/home/user');
    const parent = FS.parent(p);
    if(!parent || !parent.node || parent.node.type !== 'dir'){ toast('Parent folder not found', '⚠️'); return; }
    const r = FS.write(p, area.value);
    if(!r.ok){ toast(r.err, '⚠️'); return; }
    path = p;
    pathInput.value = p;
    dirty = false;
    updateTitle();
    toast('Saved ' + p.split('/').pop(), '💾');
  }

  area.addEventListener('input', () => {
    if(!dirty){ dirty = true; updateTitle(); }
    updateStatus();
  });
  area.addEventListener('keyup', updateStatus);
  area.addEventListener('click', updateStatus);

  area.addEventListener('keydown', e => {
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = area.selectionStart, en = area.selectionEnd;
      area.value = area.value.slice(0, s) + '  ' + area.value.slice(en);
      area.selectionStart = area.selectionEnd = s + 2;
      dirty = true;
      updateStatus();
    }
  });

  wrap.querySelector('[data-a=save]').addEventListener('click', save);
  wrap.querySelector('[data-a=open]').addEventListener('click', async () => {
    const p = await dialogPrompt({ title:'Open file', value: pathInput.value, okText:'Open' });
    if(!p) return;
    load(FS.norm(p, '/home/user'));
  });

  win.el.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); save(); }
  });

  pathInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ load(FS.norm(pathInput.value.trim() || '/home/user/untitled.txt', '/home/user')); }
  });

  if(path){
    const n = FS.node(path);
    if(n && n.type === 'file' && !dataURL(n)){
      area.value = n.content || '';
    } else if(!n || dataURL(n)){
      path = null;
      pathInput.value = '/home/user/untitled.txt';
    }
  }
  updateTitle();
  updateStatus();
  setTimeout(() => area.focus(), 40);
}

/* ---------------- app: calculator ---------------- */
function openCalculator(win){
  const wrap = el('div', 'calc');
  wrap.innerHTML = `
    <div class="calc-disp">0</div>
    <div class="calc-grid">
      <button class="warn" data-k="C">C</button>
      <button class="op" data-k="⌫">⌫</button>
      <button class="op" data-k="%">%</button>
      <button class="op" data-k="÷">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
      <button class="wide" data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
    </div>`;
  win.body.appendChild(wrap);
  const disp = wrap.querySelector('.calc-disp');
  let expr = '';

  const show = () => { disp.textContent = expr || '0'; };

  function press(k){
    if(k === 'C'){ expr = ''; }
    else if(k === '⌫'){ expr = expr.slice(0, -1); }
    else if(k === '='){
      try {
        const js = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
        const v = Function('"use strict";return (' + (js || '0') + ')')();
        if(!isFinite(v)) throw new Error('bad');
        expr = String(Math.round(v * 1e10) / 1e10);
      } catch(e){ expr = 'Error'; }
    }
    else if(k === '%'){
      const v = parseFloat(expr);
      expr = isFinite(v) ? String(v / 100) : 'Error';
    }
    else {
      if(expr === 'Error') expr = '';
      expr += k;
      if(expr.length > 40) expr = expr.slice(-40);
    }
    show();
  }

  wrap.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => press(b.dataset.k)));

  win.el.addEventListener('keydown', e => {
    const k = e.key;
    if(/^[0-9.+\-*/]$/.test(k)){ e.preventDefault(); press(k === '*' ? '×' : k === '/' ? '÷' : k === '-' ? '−' : k); }
    else if(k === 'Enter' || k === '='){ e.preventDefault(); press('='); }
    else if(k === 'Backspace'){ e.preventDefault(); press('⌫'); }
    else if(k === 'Escape'){ e.preventDefault(); press('C'); }
  });

  show();
}

    <div class="sub">Codename Horizon · Build 2026.10</div>

/* ---------------- app: snake ---------------- */
function openSnake(win){
  const wrap = el('div', 'snake');
  wrap.innerHTML = `
    <div class="snake-head"><span>Score <b class="score">0</b></span><span>Best <b class="best">0</b></span></div>
    <canvas class="snake-canvas" width="420" height="420"></canvas>
    <div class="snake-hint">Arrow keys / WASD · swipe on touch · R to restart</div>`;
  win.body.appendChild(wrap);

  const canvas = wrap.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = wrap.querySelector('.score');
  const bestEl = wrap.querySelector('.best');
  const CELL = 21, COLS = 20, ROWS = 20, W = COLS * CELL, H = ROWS * CELL;

  let snake, dir, nextDir, food, score, dead, timer;
  let best = 0;
  try { best = parseInt(localStorage.getItem('ezos.snake.high') || '0', 10) || 0; } catch(e){}
  bestEl.textContent = best;

  const accent = () => getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#38bdf8';

  function rr(x, y, w, h, r){
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function placeFood(){
    let tries = 0;
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      tries++;
    } while(tries < 500 && snake.some(s => s.x === food.x && s.y === food.y));
  }

  function reset(){
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    dead = false;
    scoreEl.textContent = '0';
    placeFood();
    draw();
  }

  function step(){
    if(dead) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    const hitSelf = snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y);
    if(hitWall || hitSelf){
      dead = true;
      if(score > best){
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('ezos.snake.high', String(best)); } catch(e){}
      }
      draw();
      return;
    }
    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if(score > 0 && score % 50 === 0) toast('Snake: ' + score + ' points!', '🐍');
    } else {
      snake.pop();
    }
    draw();
  }

  function draw(){
    const ac = accent();
    ctx.fillStyle = '#080d14';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.035)';
    ctx.lineWidth = 1;
    for(let i = 1; i < COLS; i++){
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke();
    }
    if(food){
      ctx.fillStyle = ac;
      ctx.shadowColor = ac;
      ctx.shadowBlur = 12;
      rr(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 6);
      ctx.shadowBlur = 0;
    }
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? ac : hexA(ac, Math.max(.22, .62 - i * .018));
      rr(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, i === 0 ? 6 : 4);
    });
    if(dead){
      ctx.fillStyle = 'rgba(4,8,14,.68)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = '700 23px Inter, sans-serif';
      ctx.fillText('Game Over', W / 2, H / 2 - 12);
      ctx.font = '12.5px Inter, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.fillText('Score ' + score + ' — press R or tap to restart', W / 2, H / 2 + 16);
    }
  }

  canvas.addEventListener('pointerdown', e => { win.el.focus({ preventScroll: true }); win._snakeDown = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', e => {
    const d = win._snakeDown;
    if(!d) return;
    win._snakeDown = null;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if(dead){ reset(); return; }
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    if(Math.abs(dx) > Math.abs(dy)){
      if(dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
      else if(dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
    } else {
      if(dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
      else if(dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
    }
  });

  win.el.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const map = {
      arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1],
      arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0]
    };
    if(map[k]){
      e.preventDefault();
      const [x, y] = map[k];
      if(x !== -dir.x || y !== -dir.y) nextDir = { x, y };
    } else if(k === 'r'){ reset(); }
  });

  reset();
  timer = setInterval(() => {
    if(!win.minimized && !document.hidden) step();
  }, 118);
  win.onClose.push(() => clearInterval(timer));
}

function openPaint(win){
  const wrap = el('div', 'paint');
  wrap.innerHTML = `
    <div class="paint-top">
      <input type="color" value="#38bdf8" title="Color">
      <input type="range" min="2" max="42" value="6" title="Brush size">
      <span class="lbl size-lbl">6 px</span>
      <button class="icon-btn" data-a="eraser">🩹 Eraser</button>
      <button class="icon-btn" data-a="clear">🧽 Clear</button>
      <button class="icon-btn" data-a="save">💾 Save to Pictures</button>
      <button class="icon-btn" data-a="dl">⬇ PNG</button>
    </div>
    <div class="paint-wrap"><canvas width="1200" height="800"></canvas></div>`;
  win.body.appendChild(wrap);

  const color = wrap.querySelector('input[type=color]');
  const size = wrap.querySelector('input[type=range]');
  const sizeLbl = wrap.querySelector('.size-lbl');
  const canvas = wrap.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  let eraser = false;
  let drawing = false;
  let last = null;

  function fillWhite(){
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  fillWhite();

  size.addEventListener('input', () => { sizeLbl.textContent = size.value + ' px'; });

  function pos(e){
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (canvas.width / r.width),
      y: (e.clientY - r.top) * (canvas.height / r.height)
    };
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    drawing = true;
    last = pos(e);
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    ctx.strokeStyle = eraser ? '#ffffff' : color.value;
    ctx.lineWidth = eraser ? Number(size.value) * 1.6 : Number(size.value);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(last.x + .01, last.y + .01);
    ctx.stroke();
  });

  canvas.addEventListener('pointermove', e => {
    if(!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = eraser ? '#ffffff' : color.value;
    ctx.lineWidth = eraser ? Number(size.value) * 1.6 : Number(size.value);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  });

  const stop = () => { drawing = false; last = null; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  wrap.querySelector('[data-a=eraser]').addEventListener('click', () => {
    eraser = !eraser;
    toast(eraser ? 'Eraser on' : 'Brush on', eraser ? '🩹' : '🖌️');
  });
  wrap.querySelector('[data-a=clear]').addEventListener('click', () => { fillWhite(); toast('Canvas cleared', '🧽'); });
  wrap.querySelector('[data-a=save]').addEventListener('click', () => {
    const name = 'EZOS-drawing-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.png';
    const path = '/home/user/Pictures/' + name;
    const data = canvas.toDataURL('image/png');
    const r = FS.write(path, data, 'image/png');
    if(!r.ok){ toast(r.err, '⚠️'); return; }
    toast('Saved to Pictures/' + name, '💾');
  });
  wrap.querySelector('[data-a=dl]').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'ezos-paint.png';
    a.click();
  });
}

function openStore(win){
  const wrap = el('div', 'store');
  wrap.innerHTML = `
    <div class="store-top">
      <div class="store-title">🛍️ Store <span class="badge" data-k="badge">ezos-repo</span></div>
      <input class="store-search" placeholder="Search packages…" spellcheck="false" autocomplete="off" aria-label="Search packages">
      <button class="icon-btn" data-a="refresh" title="Refresh index">↻</button>
    </div>
    <div class="store-list"><div class="store-empty">Fetching package index…</div></div>
    <div class="store-note">Packages come from <b>ezos-repo</b>. Installing registers Linux package metadata and adds terminal commands where available — the browser cannot execute native ELF binaries.</div>
    <div class="store-foot"><span data-k="count">—</span><span style="flex:1"></span><a href="${PKG_REPO_URL}" target="_blank" rel="noopener">mrzgamingv20-cyber/ezos-repo ↗</a></div>`;
  win.body.appendChild(wrap);

  const listEl = wrap.querySelector('.store-list');
  const searchEl = wrap.querySelector('.store-search');
  const badgeEl = wrap.querySelector('[data-k=badge]');
  const countEl = wrap.querySelector('[data-k=count]');
  let index = null;
  let query = '';

  const matches = name => {
    if(!query) return true;
    return name.toLowerCase().includes(query) || String(index[name] || '').toLowerCase().includes(query);
  };

  function render(){
    if(!index) return;
    badgeEl.textContent = PKG.offline ? 'offline index' : 'ezos-repo · main';
    badgeEl.style.color = PKG.offline ? '#fbbf24' : '';
    const names = Object.keys(index).filter(matches).sort();
    countEl.textContent = `${Object.keys(index).length} packages · ${PKG.list().length} installed`;
    listEl.innerHTML = '';
    if(!names.length){
      listEl.innerHTML = `<div class="store-empty">No packages match “${esc(query)}”.</div>`;
      return;
    }
    for(const name of names) listEl.appendChild(pkgCard(name));
  }

  function pkgCard(name){
    const installed = PKG.isInstalled(name);
    const meta = PKG.installed[name];
    const row = el('div', 'pkg');
    row.innerHTML = `
      <div class="pkg-ic">${PKG_ICONS[name] || '📦'}</div>
      <div class="pkg-meta">
        <div class="pkg-name">${esc(name)}${installed ? '<span class="tag">INSTALLED</span>' : ''}</div>
        <div class="pkg-desc">${esc(index[name] || '')}</div>
        <div class="pkg-sub">${PKG_CMDS[name] ? '⌨ adds command: ' + esc(name) : '📄 metadata / files only'}${installed && meta ? ' · ' + esc(fmtBytes(meta.size)) : ''}</div>
      </div>
      <div class="pkg-act"></div>`;
    const act = row.querySelector('.pkg-act');
    const btn = document.createElement('button');
    btn.className = 'btn ' + (installed ? 'installed' : 'primary');
    btn.textContent = installed ? 'Remove' : 'Install';
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = installed ? 'Removing…' : 'Installing…';
      try {
        if(installed){
          PKG.remove(name);
          toast(`Removed ${name}`, '🗑');
        } else {
          const res = await PKG.install(name);
          toast(`${name} installed${res.size ? ' · ' + fmtBytes(res.size) : ''}`, '📦');
        }
        render();
      } catch(e){
        toast(`Failed: ${e.message}`, '⚠️');
        btn.disabled = false;
        btn.textContent = installed ? 'Remove' : 'Install';
      }
    });
    act.appendChild(btn);
    return row;
  }

  async function load(force=false){
    listEl.innerHTML = '<div class="store-empty">Fetching package index…</div>';
    try { index = await PKG.fetchIndex(force); }
    catch(e){ index = { ...PKG_FALLBACK }; PKG.offline = true; }
    render();
  }

  searchEl.addEventListener('input', () => { query = searchEl.value.trim().toLowerCase(); render(); });
  wrap.querySelector('[data-a=refresh]').addEventListener('click', () => {
    load(true);
    toast('Refreshing package index…', '🔄');
  });

  load();
}

  win.body.appendChild(wrap);

  const tbody = wrap.querySelector('tbody');

  const memBar = wrap.querySelector('[data-k=membar]');
  const memSub = wrap.querySelector('[data-k=memsub]');
  const LIMIT_KB = 5 * 1024;

  function tick(){
    upEl.textContent = fmtUptime(Date.now() - SESSION_START);
    sysEl.textContent = `ezos-js 3.0 · ${window.innerWidth}×${window.innerHeight} · ${settings.theme}`;

    let kb = 0;
    try {
      for(let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        const val = localStorage.getItem(key) || '';
        kb += (key.length + val.length) / 1024;
      }
    } catch(e){}
    let heapText = '';
    try {
      if(performance.memory){
        const used = performance.memory.usedJSHeapSize;
        const limit = performance.memory.jsHeapSizeLimit || 1;
        heapText = ` · JS heap ${fmtBytes(used)}`;
      }
    } catch(e){}
    memEl.textContent = kb.toFixed(1) + ' KB';
    memBar.style.width = Math.min(100, (kb / LIMIT_KB) * 100).toFixed(1) + '%';
    memSub.textContent = `approx. ${(kb / LIMIT_KB * 100).toFixed(1)}% of ~5 MB quota${heapText}`;

    const wins = Array.from(WM.windows.values());
    if(!wins.length){
      tbody.innerHTML = `<tr><td colspan="4" style="color:var(--muted)">no user processes</td></tr>`;
      return;
    }
    tbody.innerHTML = wins.map((w, i) => {
      const n = parseInt(String(w.id).replace(/\D/g, ''), 10) || (i + 1);
      const pid = 100 + (n % 900);
      const mem = 18 + ((n * 13) % 54);
      const state = w.minimized ? '<span class="st-min">sleeping</span>' : '<span class="st-run">running</span>';
      return `<tr><td>${pid}</td><td>${esc(w.appId)}</td><td>${state}</td><td>${mem} MB</td></tr>`;
    }).join('');
  }

  tick();
  const timer = setInterval(tick, 1000);
  win.onClose.push(() => clearInterval(timer));
}

  ezinfo: {

    run: async (args, t) => {

      t.print(t.dim('codename Horizon · single-file operating system experience'));
      t.print('');
      t.print('Built with vanilla HTML, CSS and JavaScript.');

      t.print('');
      t.print(`Repo   ${t.D(PKG_REPO_URL)}`);
      t.print(`Kernel ${esc('ezos-js 3.0')}`);
      t.print(`Packages ${PKG.list().length} installed from ezos-repo`);
      t.print('');
      t.print(t.dim('— The EZOS team'));
    }
  },

  hello: {
    pkg: 'hello',
    run: async (args, t) => {
      t.print('Hello, world!');
      t.print(t.dim('Installed from ezos-repo: hello.tar.gz'));
    }
  },

  jq: {
    pkg: 'jq',
    run: async (args, t) => {
      const raw = args.includes('-r') || args.includes('--raw-output');
      const rest = args.filter(a => !['-r', '--raw-output'].includes(a));
      let filter = '.';
      let file = rest[0];
      if(rest.length >= 2){ filter = rest[0]; file = rest[1]; }
      if(!file){ t.print(t.err('usage: jq [-r] [filter] <file>')); return; }
      const path = FS.norm(file, t.cwd);
      const node = FS.node(path);
      if(!node){ t.print(t.err(`jq: ${file}: No such file or directory`)); return; }
      if(node.type !== 'file'){ t.print(t.err(`jq: ${file}: Is a directory`)); return; }
      let data;
      try { data = JSON.parse(node.content); }
      catch(e){ t.print(t.err('jq: parse error: ' + e.message)); return; }
      let out = data;
      if(filter.trim() !== '.'){
        const expr = filter.startsWith('.') ? filter : '.' + filter;
        const parts = expr.slice(1).split('.').filter(Boolean);
        for(const part of parts){
          if(out == null) break;
          const key = part.replace(/^\[(\d+)\]$/, '$1');
          out = out[key];
        }
        if(out === undefined){ t.print(t.err('jq: null')); return; }
      }
      const text = typeof out === 'string' ? (raw ? out : JSON.stringify(out)) : JSON.stringify(out, null, 2);
      t.print(esc(text));
    }
  },

  curl: {
    pkg: 'curl',
    run: async (args, t) => {
      const url = args.find(a => !a.startsWith('-'));
      if(!url){ t.print(t.err('usage: curl <url>')); return; }
      t.print(t.dim(`* fetching ${url}`));
      try {
        const res = await fetch(url);
        const text = await res.text();
        t.print(t.dim(`HTTP ${res.status} · ${text.length} bytes`));
        t.print(esc(text.slice(0, 3000)));
        if(text.length > 3000) t.print(t.dim('… output truncated'));
      } catch(e){
        t.print(t.err('curl: request failed — CORS or network blocked'));
        t.print(t.dim(String(e.message || e)));
      }
    }
  },

  dig: {
    pkg: 'dig',
    run: async (args, t) => {
      const types = ['A', 'AAAA', 'MX', 'TXT', 'CNAME', 'NS', 'SOA'];
      const type = args.map(a => a.toUpperCase()).find(a => types.includes(a)) || 'A';
      const name = args.find(a => !a.startsWith('-') && !types.includes(a.toUpperCase()));
      if(!name){ t.print(t.err('usage: dig <domain> [A|AAAA|MX|TXT|...]')); return; }
      t.print(t.dim(`; <<>> DiG-web <<>> ${name} ${type}`));
      try {
        const res = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(name)}&type=${type}`);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        t.print('');
        t.print(`;; status: ${esc(data.Status === 0 ? 'NOERROR' : String(data.Status))}`);
        if(data.Answer && data.Answer.length){
          t.print(';; ANSWER SECTION:');
          data.Answer.forEach(a => t.print(`${esc(a.name)}  ${a.TTL}  IN  ${esc(a.type)}  ${esc(a.data)}`));
        } else {
          t.print(t.dim(';; no answer'));
        }
      } catch(e){
        t.print(t.err('dig: lookup failed — ' + (e.message || 'network error')));
      }
    }
  },

  htop: {
    pkg: 'htop',
    run: async (args, t) => {
      openApp('monitor');
      t.print(t.ok('htop → opening System Monitor…'));
    }
  },

  ezupdate: {
    pkg: 'ezupdate',
    run: async (args, t) => {
      t.print(t.dim('Checking EZOS image and repository…'));
      try {
        const res = await fetch('https://api.github.com/repos/mrzgamingv20-cyber/ezos-repo/commits?per_page=1');
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const commits = await res.json();
        const c = commits[0];
        t.print(`Image   ${esc('ghcr.io/mrzgamingv20-cyber/ezos:latest')}`);
        t.print(`Status  ${t.ok('up to date')}`);
        if(c){
          t.print(`Commit  ${esc(c.sha.slice(0, 7))} — ${esc(String(c.commit.message).split('\n')[0])}`);
          t.print(`Date    ${esc(new Date(c.commit.author.date).toLocaleString())}`);
        }
      } catch(e){
        t.print(t.err('ezupdate: could not reach GitHub — ' + (e.message || 'network error')));
      }
    }
  }
};

/* ---------------- app registry ---------------- */

  editor:     { name:'Editor',     icon:'📝', color:'linear-gradient(145deg,#34d399,#059669)', size:[740,540], open: (win, o) => openEditor(win, o) },
  calculator: { name:'Calculator', icon:'🧮', color:'linear-gradient(145deg,#a78bfa,#7c3aed)', size:[330,470], open: win => openCalculator(win) },

  paint:      { name:'Paint',      icon:'🎨', color:'linear-gradient(145deg,#f472b6,#be185d)', size:[780,560], open: win => openPaint(win) },
  snake:      { name:'Snake',      icon:'🐍', color:'linear-gradient(145deg,#4ade80,#15803d)', size:[470,600], open: win => openSnake(win) },

  monitor:    { name:'System Monitor', icon:'📊', color:'linear-gradient(145deg,#38bdf8,#0f766e)', size:[580,440], hidden:true, open: win => openMonitor(win) }
};

function openApp(id, opts={}){
  const app = APPS[id];
  if(!app) return;
  const [w, h] = app.size;
  WM.spawn({
    appId: id,
    title: app.name,
    icon: app.icon,
    width: w,
    height: h,
    onOpen: win => app.open(win, opts)
  });
}

/* ---------------- desktop icons ---------------- */
const DESKTOP_ICONS = [
  { type:'app', id:'terminal', label:'Terminal' },
  { type:'app', id:'files', label:'Files' },
  { type:'app', id:'store', label:'Store' },
  { type:'app', id:'editor', label:'Editor' },
  { type:'file', path:'/home/user/welcome.txt', label:'welcome.txt' },
  { type:'app', id:'snake', label:'Snake' },
  { type:'app', id:'paint', label:'Paint' },
  { type:'app', id:'settings', label:'Settings' },
  { type:'app', id:'about', label:'About EZOS' }
];

let selectedIcon = null;

function makeDesktopIcon({ label, icon, color, open }){
  const d = el('div', 'dicon');
  d.tabIndex = 0;
  d.innerHTML = `<div class="ico" style="background:${color}">${icon}</div><div class="lbl">${esc(label)}</div>`;
  d._open = open;
  let lastTap = 0;

  d.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if(selectedIcon && selectedIcon !== d) selectedIcon.classList.remove('sel');
    selectedIcon = d;
    d.classList.add('sel');
  });

  d.addEventListener('pointerup', () => {
    const t = Date.now();
    if(t - lastTap < 340){ lastTap = 0; open(); }
    else lastTap = t;
  });

  d.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); open(); }
  });

  return d;
}

function buildDesktopIcons(){
  const wrap = $('#desktop-icons');
  wrap.innerHTML = '';
  DESKTOP_ICONS.forEach(spec => {
    let icon, color, open;
    if(spec.type === 'file'){
      icon = '📄';
      color = 'linear-gradient(145deg,#60a5fa,#2563eb)';
      open = () => openApp('editor', { path: spec.path });
    } else {
      const app = APPS[spec.id];
      if(!app) return;
      icon = app.icon;
      color = app.color;
      open = () => openApp(spec.id);
    }
    wrap.appendChild(makeDesktopIcon({ label: spec.label, icon, color, open }));
  });
}

/* ---------------- start menu ---------------- */
function buildStartMenu(){
  const sm = $('#startMenu');
  sm.innerHTML = '';

  const search = el('div', 'sm-search');
  const input = document.createElement('input');
  input.placeholder = 'Search apps…';
  input.spellcheck = false;
  search.appendChild(input);

  const grid = el('div', 'sm-grid');
  Object.entries(APPS).forEach(([id, app]) => {
    if(app.hidden) return;
    const b = document.createElement('button');
    b.className = 'sm-app';
    b.dataset.name = app.name.toLowerCase();
    b.innerHTML = `<span class="ico" style="background:${app.color}">${app.icon}</span><small>${esc(app.name)}</small>`;
    b.addEventListener('click', () => { toggleStart(false); openApp(id); });
    grid.appendChild(b);
  });

  const foot = el('div', 'sm-foot');
  foot.innerHTML = `
    <div class="avatar">U</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:12.5px;font-weight:600">user</div>
      <div style="font-size:10.5px;color:var(--muted)">Local account</div>
    </div>
    <button class="icon-btn" id="smLock" title="Lock">🔒</button>
    <button class="icon-btn" id="smPower" title="Restart">⏻</button>`;

  sm.append(search, grid, foot);

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    $$('.sm-app', grid).forEach(b => {
      b.style.display = (!q || b.dataset.name.includes(q)) ? '' : 'none';
    });
  });

  foot.querySelector('#smLock').addEventListener('click', () => { toggleStart(false); showLogin(); });
  foot.querySelector('#smPower').addEventListener('click', () => { toggleStart(false); rebootEZOS(); });
}

function toggleStart(force){
  const sm = $('#startMenu');
  const open = force !== undefined ? force : !sm.classList.contains('open');
  sm.classList.toggle('open', open);
  $('#startBtn').classList.toggle('on', open);
  if(open){
    const input = sm.querySelector('.sm-search input');
    if(input){ input.value = ''; $$('.sm-app', sm).forEach(b => b.style.display = ''); setTimeout(() => input.focus(), 30); }
  }
}

/* ---------------- system helpers ---------------- */
function fmtUptime(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if(h > 0) return `${h}h ${m}m`;
  if(m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function soundOn(){
  if(!settings.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      const t = ctx.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.06, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(g).connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.6);
    });
    setTimeout(() => ctx.close(), 1200);
  } catch(e){}
}

function applySoundIcon(){
  const b = $('#soundBtn');
  if(b) b.textContent = settings.sound ? '🔊' : '🔇';
}

function rebootEZOS(){
  toast('Restarting EZOS…', '⏻');
  setTimeout(() => location.reload(), 400);
}

function showLogin(){
  toggleStart(false);
  const lt = $('#loginTime'), ld = $('#loginDate');
  const now = new Date();
  lt.textContent = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
  ld.textContent = now.toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' });
  const login = $('#login');
  login.classList.add('show');
  login.style.background = WALLPAPERS[settings.wallpaper];
}

function doLogin(){
  const login = $('#login');
  if(!login.classList.contains('show')) return;
  login.classList.remove('show');
  SESSION_START = Date.now();
  soundOn();
  setTimeout(() => toast('Welcome back, user', '👋'), 500);
}

/* ---------------- clock ---------------- */
function startClock(){
  const tick = () => {
    const now = new Date();
    const hm = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', hour12:false });
    const clock = $('#clock');
    if(clock) clock.textContent = hm;
    const lt = $('#loginTime');
    if(lt && $('#login').classList.contains('show')) lt.textContent = hm;
  };
  tick();
  setInterval(tick, 1000);
}

/* ---------------- boot ---------------- */
const BOOT_LINES = [
  'Initializing EZOS kernel…',
  'Mounting virtual filesystem…',
  'Starting device manager…',
  'Loading userland services…',
  'Starting window manager…',
  'Launching desktop shell…',
  'EZOS is ready.'
];
let bootDone = false;

function runBoot(){
  const log = $('#bootLog');
  const bar = $('#bootBar i');
  let i = 0;
  log.innerHTML = '';
  const step = () => {
    if(bootDone || i >= BOOT_LINES.length) return;
    log.insertAdjacentHTML('beforeend', `<div><span class="ok">[ OK ]</span> ${esc(BOOT_LINES[i])}</div>`);
    bar.style.width = Math.round(((i + 1) / BOOT_LINES.length) * 100) + '%';
    i++;
    if(i < BOOT_LINES.length) setTimeout(step, 165);
    else setTimeout(finishBoot, 420);
  };
  setTimeout(step, 240);
}

function finishBoot(){
  if(bootDone) return;
  bootDone = true;
  const boot = $('#boot');
  boot.classList.add('gone');
  setTimeout(() => { boot.style.display = 'none'; }, 450);
  showLogin();
}

/* ---------------- context menu ---------------- */
function showCtxMenu(x, y){
  const menu = $('#ctxMenu');
  menu.innerHTML = '';
  const items = [
    ['⌨️', 'Open Terminal', () => openApp('terminal')],
    ['📁', 'Open Files', () => openApp('files')],
    ['⚙️', 'Settings', () => openApp('settings')],
    ['🔄', 'Reload EZOS', () => location.reload()]
  ];
  items.forEach(([ic, label, fn]) => {
    const b = document.createElement('button');
    b.innerHTML = `<span>${ic}</span><span>${esc(label)}</span>`;
    b.addEventListener('click', () => { hideCtxMenu(); fn(); });
    menu.appendChild(b);
  });
  menu.style.display = 'block';
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.min(x, window.innerWidth - mw - 8) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - mh - 8) + 'px';
}
function hideCtxMenu(){ $('#ctxMenu').style.display = 'none'; }

/* ---------------- global bindings ---------------- */
function bindGlobal(){
  $('#startBtn').addEventListener('click', e => {
    e.stopPropagation();
    toggleStart();
  });

  document.addEventListener('pointerdown', e => {
    if(!e.target.closest('#startMenu') && !e.target.closest('#startBtn')) toggleStart(false);
    if(!e.target.closest('#ctxMenu')) hideCtxMenu();
    if(e.target.closest('#desktop') && !e.target.closest('.window') && !e.target.closest('#taskbar') && !e.target.closest('#startMenu')){
      if(selectedIcon){ selectedIcon.classList.remove('sel'); selectedIcon = null; }
    }
  });

  document.addEventListener('contextmenu', e => {
    if(e.target.closest('.window') || e.target.closest('#taskbar') || e.target.closest('#startMenu')) return;
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY);
  });

  $('#soundBtn').addEventListener('click', () => {
    settings.sound = !settings.sound;
    saveSettings();
    applySoundIcon();
    toast(settings.sound ? 'Sound on' : 'Sound muted', settings.sound ? '🔊' : '🔇');
  });

  $('#loginUser').addEventListener('click', doLogin);
  $('#login').addEventListener('click', e => { if(e.target === $('#login')) doLogin(); });
  $('#login').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') doLogin(); });

  $('#boot').addEventListener('click', finishBoot);

  document.addEventListener('keydown', e => {
    if(e.ctrlKey && e.altKey && e.key.toLowerCase() === 't'){
      e.preventDefault();
      openApp('terminal');
    }
    if(e.key === 'Escape'){
      toggleStart(false);
      hideCtxMenu();
    }
    if(e.key === 'Enter' && selectedIcon && (document.activeElement === document.body || document.activeElement === selectedIcon) && !isEditable(document.activeElement)){
      e.preventDefault();
      selectedIcon._open && selectedIcon._open();
    }
  });

  window.addEventListener('resize', () => {
    if($('#login').classList.contains('show')) $('#login').style.background = WALLPAPERS[settings.wallpaper];
  });
}

/* ---------------- init ---------------- */
function init(){
  loadSettings();
  FS.load();
  applyTheme(settings.theme);
  applyAccent(settings.accent);
  applyWallpaper(settings.wallpaper);
  applySoundIcon();
  buildDesktopIcons();
  buildStartMenu();
  startClock();
  bindGlobal();
  runBoot();
  SESSION_START = Date.now();
}

init();
